<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="😈 工作台">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-180.png">
<title>😈 工作台 · 少女风个人工作台</title>
<script>
/* ══════════════════════════════════════
   缓存清除：干掉旧版 Service Worker 和缓存
   只在首次加载时执行一次，之后不再重复
   ══════════════════════════════════════ */
(function(){
  var key='gwb_cache_cleared_v4';
  try{
    if(localStorage.getItem(key)!=='yes'){
      /* 注销所有旧 Service Worker */
      if('serviceWorker' in navigator){
        navigator.serviceWorker.getRegistrations().then(function(regs){
          regs.forEach(function(r){r.unregister();});
        });
      }
      /* 清除所有 Cache Storage */
      if('caches' in window){
        caches.keys().then(function(names){
          names.forEach(function(n){caches.delete(n);});
        });
      }
      localStorage.setItem(key,'yes');
    }
  }catch(e){}
})();
/* 防白屏：任何脚本错误都显示出来，而不是留一片空白 */
window.__errShown=false;
window.onerror=function(msg,src,line,col){
  if(window.__errShown)return;window.__errShown=true;
  var d=document.createElement('div');
  d.style.cssText='position:fixed;inset:0;z-index:99999;background:#FDF4F8;color:#6B5B6E;padding:24px;font:14px/1.7 -apple-system,sans-serif;overflow:auto;';
  d.innerHTML='<div style="font-size:18px;font-weight:700;color:#E75A7C;margin-bottom:12px">⚠️ 页面加载出错</div>'
    +'<div style="background:#fff;border-radius:12px;padding:14px;margin-bottom:14px;word-break:break-all">'
    +'<b>错误：</b>'+msg+'<br><b>行号：</b>'+line+' : '+col+'</div>'
    +'<div style="opacity:.7">请把这个截图发给开发者。<br>常见原因：文件上传时被截断，没传完整。</div>';
  document.body.appendChild(d);
};
/* 文件完整性自检：脚本跑完会置 true */
window.__loadOK=false;
</script>
<style>
:root{
  --pink:#F9C9DD; --pink-deep:#F5A8C7; --blue:#BDE0FE; --blue-deep:#A2D2FF;
  --bg:#FDF4F8; --card:#FFFFFF; --red:#E75A7C; --text:#6B5B6E; --sub:#B49CB0;
  --shadow:0 6px 18px rgba(245,168,199,.25);
  --r-lg:26px; --r-md:20px; --r-sm:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--text);
  background-color:var(--bg);
  background-image:
    radial-gradient(rgba(249,201,221,.55) 12%, transparent 13%),
    radial-gradient(rgba(189,224,254,.55) 12%, transparent 13%);
  background-size:28px 28px;
  background-position:0 0,14px 14px;
  overflow:hidden;
}
#app{display:flex;height:100vh;height:100dvh;}

/* ===== 侧边栏 ===== */
#sidebar{
  width:190px;flex-shrink:0;height:100%;
  background:linear-gradient(180deg,#FFE3F0 0%,#DCEEFF 100%);
  border-radius:0 var(--r-lg) var(--r-lg) 0;
  box-shadow:4px 0 20px rgba(162,210,255,.25);
  display:flex;flex-direction:column;align-items:center;
  padding:18px 10px 14px;transition:width .3s ease;position:relative;z-index:10;
  overflow:hidden;
}
#sidebar.collapsed{width:64px;}
#toggleBtn{
  position:absolute;top:14px;right:10px;width:30px;height:30px;border:none;cursor:pointer;
  border-radius:50%;background:#fff;color:var(--red);font-size:14px;box-shadow:var(--shadow);
}
#sidebar.collapsed #toggleBtn{right:17px;}
.avatar-box{margin-top:34px;text-align:center;}
.avatar{
  width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--blue));
  display:flex;align-items:center;justify-content:center;font-size:32px;
  border:3px solid #fff;box-shadow:var(--shadow);margin:0 auto;transition:all .3s;
}
#sidebar.collapsed .avatar{width:40px;height:40px;font-size:20px;}
.nickname{font-size:15px;font-weight:700;color:var(--red);margin-top:8px;white-space:nowrap;}
#sidebar.collapsed .nickname{display:none;}
nav{margin-top:22px;width:100%;display:flex;flex-direction:column;gap:8px;}
.nav-item{
  display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--r-sm);
  cursor:pointer;font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;
  transition:all .2s;justify-content:flex-start;
}
#sidebar.collapsed .nav-item{justify-content:center;padding:10px 0;}
#sidebar.collapsed .nav-item .nav-label{display:none;}
.nav-item:hover{background:rgba(255,255,255,.6);}
.nav-item.active{background:#fff;color:var(--red);box-shadow:var(--shadow);}
.nav-ico{font-size:18px;}
.side-foot{margin-top:auto;font-size:10px;color:var(--sub);white-space:nowrap;}
#sidebar.collapsed .side-foot{display:none;}

/* ===== 主区域 ===== */
#main{flex:1;display:flex;flex-direction:column;height:100%;overflow:hidden;padding:14px 12px 0;}
#header{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
#moduleTitle{font-size:20px;font-weight:800;color:var(--red);text-shadow:0 2px 0 rgba(255,255,255,.8);}
.date-pick{
  border:none;border-radius:999px;padding:6px 12px;font-size:12px;color:var(--text);
  background:#fff;box-shadow:var(--shadow);font-family:inherit;
}
.mini-btn{
  border:none;border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;
  background:#fff;color:var(--red);box-shadow:var(--shadow);font-weight:600;
}
.mini-btn.blue{color:#5B8DC9;}

/* 标签栏 */
#tabbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px 2px 10px;flex-shrink:0;}
.tab{
  padding:10px 8px;border-radius:var(--r-sm);font-size:13px;font-weight:700;cursor:pointer;text-align:center;
  background:rgba(255,255,255,.7);color:var(--sub);transition:all .2s;border:2px solid transparent;
}
.tab.active{background:linear-gradient(135deg,var(--pink),var(--blue));color:#fff;box-shadow:var(--shadow);}

/* 内容区 */
#content{flex:1;overflow-y:auto;padding-bottom:30px;scrollbar-width:none;}
#content::-webkit-scrollbar{display:none;}
.card{
  background:var(--card);border-radius:var(--r-lg);padding:16px;margin-bottom:14px;
  box-shadow:var(--shadow);
}
.card-title{font-size:15px;font-weight:800;color:var(--red);margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.card-title .tag{font-size:10px;background:var(--blue);color:#fff;padding:2px 8px;border-radius:999px;font-weight:600;}

/* 待办条目 */
.todo-item{
  display:flex;align-items:flex-start;gap:10px;padding:10px;border-radius:var(--r-sm);
  background:#FDF6FA;margin-bottom:8px;
}
.todo-item.done .todo-text{text-decoration:line-through;color:var(--sub);}
.chk{
  width:22px;height:22px;flex-shrink:0;border-radius:8px;border:2px solid var(--pink-deep);
  background:#fff;appearance:none;cursor:pointer;position:relative;margin-top:2px;
}
.chk:checked{background:linear-gradient(135deg,var(--pink-deep),var(--blue-deep));border-color:transparent;}
.chk:checked::after{content:"✓";color:#fff;font-size:14px;position:absolute;top:0;left:4px;}
.todo-body{flex:1;min-width:0;}
.todo-text{width:100%;border:none;background:transparent;font-size:14px;font-weight:600;color:var(--text);font-family:inherit;outline:none;}
.todo-note{width:100%;border:none;background:transparent;font-size:11px;color:var(--sub);font-family:inherit;outline:none;margin-top:2px;}
.todo-time{font-size:10px;color:var(--blue-deep);background:#EFF7FF;border:none;border-radius:999px;padding:2px 8px;margin-top:4px;font-family:inherit;width:auto;outline:none;}
.del-btn{border:none;background:transparent;color:#F0B6C9;font-size:15px;cursor:pointer;flex-shrink:0;padding:2px;}
.del-btn:hover{color:var(--red);}
.add-btn{
  width:100%;border:2px dashed var(--pink);background:rgba(255,255,255,.5);color:var(--red);
  border-radius:var(--r-sm);padding:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;
}

/* 表单 */
.f-row{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
.f-label{font-size:12px;font-weight:700;color:var(--sub);}
.f-input,.f-select,.f-area{
  border:2px solid #F5E1EC;border-radius:var(--r-sm);padding:9px 12px;font-size:13px;
  color:var(--text);background:#FFFDFE;font-family:inherit;outline:none;width:100%;
}
.f-input:focus,.f-area:focus{border-color:var(--blue);}
.f-area{resize:vertical;min-height:70px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* 照片 */
.photo-box{
  width:100%;min-height:110px;border-radius:var(--r-md);border:2px dashed var(--blue);
  background:#F4FAFF;display:flex;align-items:center;justify-content:center;cursor:pointer;
  color:var(--blue-deep);font-size:13px;font-weight:700;overflow:hidden;position:relative;
}
/* 饮食页内子标签 */
.diet-subtabs{display:flex;gap:10px;margin-bottom:14px;}
.diet-subtab{
  flex:1;padding:9px 0;border-radius:999px;font-size:14px;font-weight:700;
  cursor:pointer;text-align:center;border:2px solid transparent;
  background:linear-gradient(135deg,rgba(249,201,221,.45),rgba(189,224,254,.45));
  color:#D48FB0;transition:all .2s;
}
.diet-subtab.active{background:linear-gradient(135deg,var(--pink),var(--blue));color:#fff;box-shadow:var(--shadow);}
.diet-card-subtitle{font-size:12px;color:var(--sub);margin-top:-8px;margin-bottom:12px;}
.bgm-play{flex-shrink:0;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--pink),var(--blue));color:#fff;font-size:13px;cursor:pointer;box-shadow:var(--shadow);}

/* 补品列表（截图样式） */
.sup-item{
  display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:var(--r-sm);
  background:#FDF6FA;margin-bottom:8px;
}
.sup-item.done .sup-name{text-decoration:line-through;color:var(--sub);}
.sup-chk{
  width:24px;height:24px;flex-shrink:0;border-radius:10px;border:2.5px solid var(--pink-deep);
  background:#fff;appearance:none;cursor:pointer;margin-top:1px;
}
.sup-chk:checked{background:linear-gradient(135deg,var(--pink-deep),var(--blue-deep));border-color:transparent;}
.sup-chk:checked::after{content:"✓";color:#fff;font-size:15px;position:absolute;top:3px;left:5px;font-weight:700;}
.sup-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}
.sup-row{display:flex;align-items:center;gap:6px;}
.sup-name{font-size:15px;font-weight:700;color:var(--text);border:none;background:transparent;outline:none;width:100%;font-family:inherit;}
.sup-time{font-size:12px;color:var(--blue-deep);background:#EFF7FF;border:none;border-radius:999px;padding:2px 8px;font-family:inherit;outline:none;width:auto;white-space:nowrap;}
.sup-note{font-size:11px;color:var(--sub);border:none;background:transparent;outline:none;width:100%;font-family:inherit;}
.sup-del{border:none;background:transparent;color:#F0B6C9;font-size:16px;cursor:pointer;flex-shrink:0;padding:2px;margin-top:4px;}
.add-btn-grad{
  width:100%;border:none;border-radius:var(--r-sm);padding:12px;font-size:14px;font-weight:700;
  cursor:pointer;font-family:inherit;color:#fff;
  background:linear-gradient(135deg,var(--pink),var(--blue));box-shadow:var(--shadow);
}

.photo-box img{width:100%;display:block;border-radius:var(--r-md);}
.pill{display:inline-block;font-size:11px;padding:3px 10px;border-radius:999px;background:#FDEFF5;color:var(--red);font-weight:700;margin:2px;}
.pill.b{background:#EFF7FF;color:#5B8DC9;}

/* 图表 */
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;}
.bar-label{width:52px;flex-shrink:0;font-weight:700;}
.bar-track{flex:1;height:14px;border-radius:999px;background:#F6EDF3;overflow:hidden;}
.bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--pink-deep),var(--blue-deep));transition:width .4s;}
.bar-val{width:70px;text-align:right;font-weight:700;color:var(--red);flex-shrink:0;}
.day-chart{display:flex;align-items:flex-end;gap:3px;height:90px;padding-top:6px;}
.day-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;}
.day-bar{width:100%;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--pink),var(--blue));min-height:2px;}
.day-num{font-size:8px;color:var(--sub);}

.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.stat-box{background:linear-gradient(135deg,#FFEFF6,#EDF6FF);border-radius:var(--r-md);padding:10px;text-align:center;}
.stat-num{font-size:16px;font-weight:800;color:var(--red);}
.stat-lab{font-size:10px;color:var(--sub);margin-top:2px;}

.mood-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.mood-btn{font-size:22px;background:#fff;border:2px solid #F5E1EC;border-radius:14px;padding:6px 10px;cursor:pointer;transition:all .2s;}
.mood-btn.sel{border-color:var(--pink-deep);background:#FDEFF5;transform:scale(1.1);}

/* 情绪记录（截图3样式） */
.mood-picker{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:16px;}
.mood-emo{
  width:52px;height:52px;border-radius:16px;border:2.5px solid #F0E0EA;background:#fff;
  font-size:26px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s;user-select:none;
}
.mood-emo.sel{border-color:var(--pink-deep);background:linear-gradient(135deg,#FFE8F3,#E8F0FF);transform:scale(1.08);box-shadow:0 4px 10px rgba(245,168,199,.25);}
.mood-diary{width:100%;min-height:100px;border:2px solid #F5E1EC;border-radius:var(--r-md);padding:12px;font-size:14px;color:var(--text);font-family:inherit;outline:none;resize:vertical;background:#FFFDFE;}

/* 愿望清单（截图4样式） */
.wish-group{margin-bottom:20px;}
.wish-group-title{font-size:15px;font-weight:800;color:var(--red);margin-bottom:4px;display:flex;align-items:center;gap:6px;}
.wish-hint{text-align:center;color:var(--sub);font-size:13px;margin-bottom:10px;}
.wish-input-row{display:flex;gap:8px;align-items:center;}
.wish-input{flex:1;border:2px solid #F5E1EC;border-radius:var(--r-sm);padding:10px 14px;font-size:14px;color:var(--text);font-family:inherit;outline:none;background:#FFFDFE;}
.wish-add-btn{
  width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--pink),var(--blue));color:#fff;
  font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow);flex-shrink:0;
}
.wish-item{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--r-sm);background:#FDF6FA;margin-bottom:6px;}
.wish-item.done .wish-text{text-decoration:line-through;color:var(--sub);}
.wish-text{flex:1;font-size:14px;font-weight:600;border:none;background:transparent;outline:none;font-family:inherit;}

/* 灵感收集（截图5样式） */
.idea-textarea{width:100%;min-height:90px;border:2px solid #F5E1EC;border-radius:var(--r-md);padding:14px;font-size:14px;color:var(--text);font-family:inherit;outline:none;resize:vertical;background:#FFFDFE;margin-bottom:12px;}
.idea-list-title{font-size:15px;font-weight:800;color:var(--red);display:flex;align-items:center;gap:6px;}

/* 记账快捷录入（截图样式） */
.acc-type-toggle{display:flex;gap:10px;margin-bottom:14px;}
.acc-type-btn{
  flex:1;padding:10px;border-radius:999px;font-size:15px;font-weight:700;
  cursor:pointer;text-align:center;border:2.5px solid transparent;
  background:#FDF0F5;color:var(--sub);transition:all .2s;
}
.acc-type-btn.out{background:#FFE3EF;color:var(--red);border-color:var(--pink-deep);}
.acc-type-btn.in{background:#E8F2FF;color:#5B8DC9;border-color:var(--blue-deep);}
.cat-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.cat-pill{
  padding:7px 16px;border-radius:999px;font-size:13px;font-weight:600;
  border:2px solid #E8DDE4;background:#fff;color:var(--text);
  cursor:pointer;transition:all .2s;user-select:none;
}
.cat-pill.sel{border-color:var(--pink-deep);background:#FDEFF5;color:var(--red);}
.cat-pill.sel.in-sel{border-color:var(--blue-deep);background:#EFF7FF;color:#5B8DC9;}
.acc-amount-row{display:flex;gap:8px;margin-bottom:10px;}
.acc-amount-input{flex:1;border:2px solid #F5E1EC;border-radius:var(--r-sm);padding:11px 14px;font-size:18px;font-weight:700;color:var(--red);font-family:inherit;outline:none;background:#FFFDFE;}
.acc-note-input{flex:1;border:2px solid #F5E1EC;border-radius:var(--r-sm);padding:11px 14px;font-size:13px;color:var(--sub);font-family:inherit;outline:none;background:#FFFDFE;}
.acc-unnecessary{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);margin-bottom:12px;}
.acc-unnecessary input[type="checkbox"]{width:20px;height:20px;border-radius:8px;}

.rec-card{background:#FBF7FA;border-radius:var(--r-md);padding:12px;margin-bottom:10px;position:relative;}
.rec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.rec-date{font-size:10px;color:var(--sub);}
.empty-tip{text-align:center;color:var(--sub);font-size:12px;padding:24px 0;}
.hint{font-size:10px;color:var(--sub);margin-top:6px;line-height:1.5;}
.amount-in{color:#7BC496;font-weight:800;}
.amount-out{color:var(--red);font-weight:800;}

/* 收支汇总（图一风格） */
.acc-summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.acc-sum-item{text-align:center;padding:3px 4px;background:linear-gradient(135deg,rgba(189,224,254,.18),rgba(249,201,221,.18));border-radius:var(--r-sm);}
.acc-sum-val{font-size:14px;font-weight:800;line-height:1.1;}
.acc-sum-lab{font-size:10px;color:var(--sub);margin-top:0;}
.acc-budget-row{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--sub);}
.acc-bud-label{white-space:nowrap;}
.acc-bud-num{cursor:pointer;color:var(--red);font-weight:800;font-size:14px;border-bottom:1px dashed var(--pink-deep);}
.acc-progress-track{height:8px;border-radius:99px;background:#F0E0E8;margin-top:4px;overflow:hidden;}
.acc-progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--pink));transition:width .3s;}
.acc-progress-label{font-size:10px;color:var(--sub);margin-top:10px;}
.acc-daily-input{width:100%;border:none;background:transparent;text-align:center;font-size:17px;font-weight:800;color:var(--red);font-family:inherit;outline:none;}
.acc-daily-input::placeholder{font-size:13px;font-weight:600;color:var(--sub);}

/* 食谱卡片 */
.recipe-tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:10px;margin-right:4px;}
.recipe-tag-meat{background:#FFF0E5;color:#E89230;}
.recipe-tag-lowfat{background:#E8F5E9;color:#4CAF50;}
.recipe-tag-veg{background:#F3E5F5;color:#9C27B0;}

/* 自媒体 */
.media-hot-card{background:linear-gradient(135deg,rgba(249,201,221,.15),rgba(189,224,254,.15));border-radius:var(--r-md);padding:12px;margin-bottom:8px;border-left:3px solid var(--pink-deep);}

/* 行李清单（图二风格） */
.packing-item{display:flex;align-items:center;gap:10px;padding:12px 8px;border-bottom:1px solid #F5E1EC;}
.packing-item:last-child{border-bottom:none;}
.packing-check{position:relative;display:flex;align-items:center;cursor:pointer;width:22px;height:22px;flex-shrink:0;}
.packing-check input{position:absolute;opacity:0;width:100%;height:100%;cursor:pointer;margin:0;z-index:2;}
.packing-checkmark{width:22px;height:22px;border-radius:50%;border:2px solid #D4D4D4;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.packing-check input:checked + .packing-checkmark{background:linear-gradient(135deg,var(--blue),var(--pink));border-color:transparent;}
.packing-check input:checked + .packing-checkmark::after{content:'✓';color:#fff;font-size:13px;font-weight:700;}
.packing-name{flex:1;font-size:14px;color:var(--text);transition:all .2s;}
.packing-name.packed{text-decoration:line-through;color:var(--sub);}
.packing-name-input{flex:1;min-width:0;font-size:14px;color:var(--text);border:none;background:transparent;outline:none;padding:4px 4px;border-radius:6px;font-family:inherit;}
.packing-name-input:focus{background:rgba(189,224,254,.15);}
.packing-name-input.packed{text-decoration:line-through;color:var(--sub);}
.packing-list{display:flex;flex-direction:column;}
.packing-item{position:relative;transition:box-shadow .15s,transform .15s,opacity .15s;}
.packing-item.dragging{opacity:.65;box-shadow:0 6px 16px rgba(245,168,199,.55);transform:scale(1.02);background:#FFF7FB;z-index:5;}
.pack-grip{color:var(--sub);font-size:16px;line-height:1;flex-shrink:0;cursor:grab;user-select:none;touch-action:none;padding:0 2px;}
.packing-del{width:24px;height:24px;border:none;background:none;color:var(--sub);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:50%;}
.packing-del:active{background:#FEE;}
.packing-add-row{display:flex;gap:8px;margin-top:12px;}

@media (max-width:480px){
  #sidebar{width:150px;position:absolute;left:0;top:0;bottom:0;}
  #sidebar.collapsed{position:relative;}
  #main{padding-left:10px;}
}
</style>
</head>
<body>
<div id="app">
  <!-- 左侧导航 -->
  <aside id="sidebar" class="collapsed">
    <button id="toggleBtn" onclick="toggleSide()">☰</button>
    <div class="avatar-box">
      <div class="avatar">😈</div>
      <div class="nickname">😈 工作台</div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">🌸 蓝粉少女工作台</div>
  </aside>

  <!-- 右侧主区域 -->
  <main id="main">
    <div id="header">
      <span id="moduleTitle"></span>
      <input type="date" id="datePick" class="date-pick" onchange="changeDate(this.value)">
      <button class="mini-btn" id="delDayBtn" onclick="deleteDay()">🗑 删除当天记录</button>
    </div>
    <div id="tabbar"></div>
    <div id="content"></div>
  </main>
</div>

<script>
/* ================== 基础工具 ================== */
const DB_KEY='girly_wb_v1';
let db; try{db=JSON.parse(localStorage.getItem(DB_KEY))||{}}catch(e){db={}}
function save(){localStorage.setItem(DB_KEY,JSON.stringify(db));}
function uid(){return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function nowTime(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function get(path,def){let o=db;for(const k of path){if(o==null||o[k]==null)return def;o=o[k];}return o;}
function set(path,val){let o=db;for(let i=0;i<path.length-1;i++){if(o[path[i]]==null)o[path[i]]={};o=o[path[i]];}o[path[path.length-1]]=val;save();}

const state={module:'plan',tab:0,date:todayStr(),dietSub:'supp',copySub:'copy'};

/* ================== 模块定义 ================== */
const MODULES={
  plan:{ico:'📅',name:'每日计划',tabs:['🍱 饮食','📝 待办清单','🗓️ 日程规划'],useDate:true,canDel:true},
  account:{ico:'💰',name:'记账',tabs:['💴 今日收支','📊 月度账单','🎯 预算规划','🔍 消费复盘'],useDate:true},
  achieve:{ico:'🏆',name:'每日成就',tabs:['✅ 今日成果'],useDate:true,canDel:true},
  recipe:{ico:'🍳',name:'每日食谱',tabs:['🥕 报食材配菜','🥗 低脂食谱','🎲 随机三餐']},
  sport:{ico:'🏃',name:'运动打卡',tabs:['💪 当日运动','📏 身体数据'],useDate:true},
  tarot:{ico:'🔮',name:'塔罗日记',tabs:['🃏 今日抽牌'],useDate:true,canDel:true},
  tree:{ico:'🌳',name:'小树洞',tabs:['✏️ 日常随笔','🌈 情绪记录','⭐ 愿望清单','💡 灵感收集']},
  media:{ico:'📹',name:'自媒体',tabs:['💡 选题灵感','✅ 爆款二创','📚 选题灵感库','📝 文案&BGM']},
  travel:{ico:'✈️',name:'旅行',tabs:['🧳 行李清单','📋 行程攻略']},
};

/* ================== 布局渲染 ================== */
function toggleSide(){document.getElementById('sidebar').classList.toggle('collapsed');}
function renderNav(){
  const nav=document.getElementById('nav');
  nav.innerHTML=Object.keys(MODULES).map(k=>{
    const m=MODULES[k];
    return `<div class="nav-item ${state.module===k?'active':''}" onclick="switchModule('${k}')">
      <span class="nav-ico">${m.ico}</span><span class="nav-label">${m.name}</span></div>`;
  }).join('');
}
function switchModule(k){state.module=k;state.tab=0;renderAll();}
function switchTab(i){state.tab=i;renderAll();}
function changeDate(v){if(v){state.date=v;renderAll();}}
function deleteDay(){
  if(!confirm('确定删除 '+state.date+' 的本模块记录吗？')) return;
  if(state.module==='plan'&&db.plan) delete db.plan[state.date];
  if(state.module==='tarot'&&db.tarot) delete db.tarot[state.date];
  if(state.module==='sport'&&db.sport) delete db.sport[state.date];
  if(state.module==='achieve'&&db.achieve) delete db.achieve[state.date];
  save();renderAll();
}
function renderAll(){
  const m=MODULES[state.module];
  renderNav();
  document.getElementById('moduleTitle').textContent=m.ico+' '+m.name;
  const dp=document.getElementById('datePick');
  dp.style.display=m.useDate?'':'none';dp.value=state.date;
  document.getElementById('delDayBtn').style.display=(m.canDel||['sport'].includes(state.module))?'':'none';
  document.getElementById('tabbar').innerHTML=m.tabs.map((t,i)=>
    `<div class="tab ${i===state.tab?'active':''}" onclick="switchTab(${i})">${t}</div>`).join('');
  const c=document.getElementById('content');
  const fn=RENDERERS[state.module][state.tab];
  c.innerHTML=fn();
  c.scrollTop=0;
  setupPackingDrag();   /* 绑定一次长拖排序（guard 防重复） */
}

/* ================== 通用列表组件 ================== */
function todoListHTML(path,items,opts={}){
  const p=JSON.stringify(path).replace(/"/g,'&quot;');
  let html=items.map(it=>`
    <div class="todo-item ${it.done?'done':''}">
      <input type="checkbox" class="chk" ${it.done?'checked':''} onchange="tToggle(${p},'${it.id}')">
      <div class="todo-body">
        <input class="todo-text" value="${esc(it.text)}" placeholder="写点什么…" onchange="tEdit(${p},'${it.id}','text',this.value)">
        <input class="todo-note" value="${esc(it.note||'')}" placeholder="备注小字…" onchange="tEdit(${p},'${it.id}','note',this.value)">
        <input class="todo-time" type="time" value="${esc(it.time||'')}" onchange="tEdit(${p},'${it.id}','time',this.value)">
      </div>
      <button class="del-btn" onclick="tDel(${p},'${it.id}')">✕</button>
    </div>`).join('');
  if(!items.length) html=`
    <div class="todo-item">
      <input type="checkbox" class="chk" disabled>
      <div class="todo-body">
        <input class="todo-text" placeholder="写点什么…" onchange="tNew(${p},'text',this.value)">
        <input class="todo-note" placeholder="备注小字…" onchange="tNew(${p},'note',this.value)">
        <input class="todo-time" type="time" onchange="tNew(${p},'time',this.value)">
      </div>
    </div>`;
  return html+(items.length?`<button class="add-btn" onclick="tAdd(${p})">＋ ${opts.addText||'添加一项'}</button>`:'');
}
function tNew(path,field,value){
  if(field==='text'&&!String(value).trim())return;
  const it={id:uid(),text:'',note:'',time:nowTime(),done:false};it[field]=value;
  tGetList(path).push(it);save();renderAll();
}
function calFoodNew(meal,k,v){
  if(k==='name'&&!String(v).trim())return;
  const f={id:uid(),name:'',grams:100,per100:0,kcal:0,auto:false,meal:meal||''};f[k]=v;
  if(k==='name'){const hit=Object.keys(FOOD_DB).find(n=>v.includes(n)||n.includes(v));if(hit&&v.trim()){f.per100=FOOD_DB[hit];f.auto=true;}}
  f.kcal=Math.round((+f.grams||0)*(+f.per100||0)/100);
  calData().foods.push(f);save();renderAll();
}
function tGetList(path){let l=get(path,null);if(!l){l=[];set(path,l);}return l;}
function tAdd(path){tGetList(path).push({id:uid(),text:'',note:'',time:nowTime(),done:false});save();renderAll();}
function tToggle(path,id){const l=tGetList(path);const it=l.find(x=>x.id===id);if(it){it.done=!it.done;save();renderAll();}}
function tEdit(path,id,k,v){const l=tGetList(path);const it=l.find(x=>x.id===id);if(it){it[k]=v;save();}}
function tDel(path,id){set(path,tGetList(path).filter(x=>x.id!==id));renderAll();}

/* 照片上传 */
function pickPhoto(cb){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{window[cb](r.result);};r.readAsDataURL(f);};
  inp.click();
}

/* ==================================================
   1️⃣ 每日计划
================================================== */
function planData(){if(!db.plan)db.plan={};if(!db.plan[state.date])db.plan[state.date]={};return db.plan[state.date];}

/* --- 饮食（双子标签：补品类｜饮食） --- */
const MEALS=[['breakfast','🍽️ 饮食']];
function renderPlanDiet(){
  const d=planData();
  const isSupp=(state.dietSub==='supp');
  const supList=get(['plan',state.date,'supplements'],[]);

  /* 补品列表 */
  const p=JSON.stringify(['plan',state.date,'supplements']).replace(/"/g,'&quot;');
  let supHtml=supList.map(it=>`
    <div class="sup-item ${it.done?'done':''}">
      <input type="checkbox" class="sup-chk" ${it.done?'checked':''} style="position:relative;" onchange="tToggle(${p},'${it.id}')">
      <div class="sup-body">
        <div class="sup-row">
          <input class="sup-name" value="${esc(it.text)}" placeholder="如：维生素C / 鱼油 / 钙片" onchange="tEdit(${p},'${it.id}','text',this.value)">
          <input class="sup-time" type="time" value="${esc(it.time||'')}" onchange="tEdit(${p},'${it.id}','time',this.value)">
        </div>
        <input class="sup-note" value="${esc(it.note||'')}" placeholder="备注（如：增强抵抗力）" onchange="tEdit(${p},'${it.id}','note',this.value)">
      </div>
      <button class="sup-del" onclick="tDel(${p},'${it.id}')">✕</button>
    </div>`).join('');
  if(!supList.length) supHtml=`<div class="sup-item">
    <input type="checkbox" class="sup-chk" style="position:relative;" disabled>
    <div class="sup-body">
      <div class="sup-row">
        <input class="sup-name" placeholder="如：维生素C / 鱼油 / 钙片" onchange="tNew(${p},'text',this.value)">
        <input class="sup-time" type="time" onchange="tNew(${p},'time',this.value)">
      </div>
      <input class="sup-note" placeholder="备注（如：增强抵抗力）" onchange="tNew(${p},'note',this.value)">
    </div>
  </div>`;

  /* 三餐卡片：拍照 + 时间 + 各自的食物热量列表 */
  const cd=calData();
  const kcalTotal=cd.foods.reduce((a,b)=>a+(+b.kcal||0),0);
  const foodItem=(f)=>`
    <div class="rec-card">
      <div class="rec-head"><span class="pill">🍡 食物</span><button class="del-btn" onclick="calFoodDel('${f.id}')">✕</button></div>
      <div class="f-row"><span class="f-label">食物名称（自动检索热量库）</span><input class="f-input" value="${esc(f.name)}" placeholder="如：米饭 / 奶茶 / 鸡胸肉" onchange="calFoodEdit('${f.id}','name',this.value)"></div>
      <div class="grid2">
        <div class="f-row"><span class="f-label">分量 (g/ml)</span><input class="f-input" type="number" value="${esc(f.grams)}" onchange="calFoodEdit('${f.id}','grams',this.value)"></div>
        <div class="f-row"><span class="f-label">每100g热量</span><input class="f-input" type="number" value="${esc(f.per100)}" onchange="calFoodEdit('${f.id}','per100',this.value)"></div>
      </div>
      <div style="font-size:13px;font-weight:800;color:var(--red);">🔥 本项热量：${f.kcal||0} kcal ${f.auto?'<span class="pill b">已自动写入</span>':''}</div>
    </div>`;
  let mealHtml=`<div class="stat-grid">
    <div class="stat-box"><div class="stat-num">${cd.foods.length}</div><div class="stat-lab">食物条目</div></div>
    <div class="stat-box"><div class="stat-num">🔥${kcalTotal}</div><div class="stat-lab">今日总热量</div></div>
    <div class="stat-box"><div class="stat-num">${kcalTotal<=1600?'💚':'🧡'}</div><div class="stat-lab">${kcalTotal<=1600?'热量友好':'今天吃得香'}</div></div>
  </div>`;
  for(const [k,label] of MEALS){
    const m=(d.meals&&d.meals[k])||{};
    const mealFoods=cd.foods.filter(f=>f.meal===k);
    const mealKcal=mealFoods.reduce((a,b)=>a+(+b.kcal||0),0);
    const ghostFood=`<div class="rec-card">
      <div class="rec-head"><span class="pill">🍡 食物</span></div>
      <div class="f-row"><span class="f-label">食物名称（自动检索热量库）</span><input class="f-input" placeholder="如：米饭 / 奶茶 / 鸡胸肉" onchange="calFoodNew('${k}','name',this.value)"></div>
    </div>`;
    mealHtml+=`<div class="card"><div class="card-title">${label} <span class="tag">🔥 ${mealKcal} kcal</span></div>
      <div class="photo-box" onclick="pickPhoto('setMeal_${k}')">${m.photo?`<img src="${m.photo}">`:'📷 点击拍照 / 上传美食照'}</div>
      ${m.photo?`<button class="mini-btn" style="margin-top:8px" onclick="mealEdit('${k}','photo','');renderAll()">🗑 删除照片</button>`:''}
      <div style="margin-top:12px;">${mealFoods.length?mealFoods.map(foodItem).join(''):ghostFood}</div>
      ${mealFoods.length?`<button class="add-btn-grad" onclick="calFoodAdd('${k}')">＋ 添加食物（热量自动写入）</button>`:''}
    </div>`;
  }
  /* 未归属到三餐的食物（如从热量模块添加的）*/
  const otherFoods=cd.foods.filter(f=>!['breakfast'].includes(f.meal));
  if(otherFoods.length){
    mealHtml+=`<div class="card"><div class="card-title">🍪 加餐 / 其他 <span class="tag">🔥 ${otherFoods.reduce((a,b)=>a+(+b.kcal||0),0)} kcal</span></div>
      ${otherFoods.map(foodItem).join('')}</div>`;
  }
  mealHtml+=`<div class="hint">💡 输入食物名后自动匹配内置热量库（${Object.keys(FOOD_DB).length} 种常见食物）；查不到时可手动填写「每100g热量」。</div>`;

  return `
  <div class="card">
    <div class="card-title">🍓 补剂 & 饮食打卡</div>
    <div class="diet-card-subtitle">今天也要好好照顾自己呀～</div>
    <div class="diet-subtabs">
      <div class="diet-subtab ${isSupp?'active':''}" onclick="switchDiet('supp')">💊 补品类</div>
      <div class="diet-subtab ${!isSupp?'active':''}" onclick="switchDiet('meal')">🍽️ 饮食</div>
    </div>
    ${isSupp ? supHtml+`<button class="add-btn-grad" onclick="tAdd(${p})">＋ 添加补品</button>
      <div class="hint">💡 补品清单每天通用，勾选记录当天是否已吃，按日期独立存档</div>` : mealHtml}
  </div>`;
}
function switchDiet(v){state.dietSub=v;renderAll();}
function mealEdit(k,field,v){const d=planData();if(!d.meals)d.meals={};if(!d.meals[k])d.meals[k]={};d.meals[k][field]=v;save();}
for(const [k] of [['breakfast']]){
  window['setMeal_'+k]=(data)=>{mealEdit(k,'photo',data);mealEdit(k,'time',nowTime());renderAll();};
}

/* --- 待办清单 --- */
function renderPlanTodo(){
  const secs=[['today','🌷 今日任务'],['urgent','🚨 紧急事项'],['longterm','🌈 长期规划']];
  return secs.map(([k,label])=>`<div class="card"><div class="card-title">${label}</div>
    ${todoListHTML(['plan',state.date,'todos',k],get(['plan',state.date,'todos',k],[]),{addText:'添加待办'})}</div>`).join('');
}

/* --- 日程规划 --- */
function renderPlanSchedule(){
  const list=get(['plan',state.date,'schedule'],[]);
  const p=JSON.stringify(['plan',state.date,'schedule']).replace(/"/g,'&quot;');
  let items=list.map(it=>`
    <div class="todo-item ${it.done?'done':''}">
      <input type="checkbox" class="chk" ${it.done?'checked':''} onchange="tToggle(${p},'${it.id}')">
      <div class="todo-body">
        <input class="todo-text" value="${esc(it.text)}" placeholder="重要事项…" onchange="tEdit(${p},'${it.id}','text',this.value)">
        <input class="todo-note" value="${esc(it.note||'')}" placeholder="备注…" onchange="tEdit(${p},'${it.id}','note',this.value)">
        <div style="display:flex;gap:6px;align-items:center;margin-top:4px;">
          <span style="font-size:10px;color:var(--sub);">⏰ 截止</span>
          <input class="todo-time" type="date" style="width:auto" value="${esc(it.deadline||'')}" onchange="tEdit(${p},'${it.id}','deadline',this.value)">
        </div>
      </div>
      <button class="del-btn" onclick="tDel(${p},'${it.id}')">✕</button>
    </div>`).join('');
  if(!list.length) items=`
    <div class="todo-item">
      <input type="checkbox" class="chk" disabled>
      <div class="todo-body">
        <input class="todo-text" placeholder="重要事项…" onchange="tNew(${p},'text',this.value)">
        <input class="todo-note" placeholder="备注…" onchange="tNew(${p},'note',this.value)">
        <div style="display:flex;gap:6px;align-items:center;margin-top:4px;">
          <span style="font-size:10px;color:var(--sub);">⏰ 截止</span>
          <input class="todo-time" type="date" style="width:auto" onchange="tNew(${p},'deadline',this.value)">
        </div>
      </div>
    </div>`;
  return `<div class="card"><div class="card-title">⏳ 重要截止日提醒 <span class="tag">每天可自行记录</span></div>
    ${items}${list.length?`<button class="add-btn" onclick="tAdd(${p})">＋ 添加日程 / 截止提醒</button>`:''}</div>`;
}


/* ==================================================
   2️⃣ 记账
================================================== */
const CATS_OUT=['🍜 餐饮','🛍 购物','🚌 交通','💄 美妆','🏠 居家','🧸 其他'];
const CATS_IN=['💼 工资','🧧 红包','📈 理财','🎁 其他收入'];
function accRecords(){if(!db.account)db.account={};if(!db.account.records)db.account.records=[];return db.account.records;}

/* 记账快捷录入状态 */
let _accType='out',_accCat=CATS_OUT[0];

function renderAccToday(){
  const recs=accRecords().filter(r=>r.date===state.date);
  const inSum=recs.filter(r=>r.type==='in').reduce((a,b)=>a+ +b.amount,0);
  const outSum=recs.filter(r=>r.type==='out').reduce((a,b)=>a+ +b.amount,0);
  /* 本月汇总 */
  const mRecs=monthRecs();
  const mIn=mRecs.filter(r=>r.type==='in').reduce((a,b)=>a+ +b.amount,0);
  const mOut=mRecs.filter(r=>r.type==='out').reduce((a,b)=>a+ +b.amount,0);
  /* 预算 */
  const budget=getBudget();
  const dailyBudget=getDailyBudget();
  const usedPct=budget>0?Math.min(100,(mOut/budget*100)).toFixed(0):0;
  const dayUsedPct=dailyBudget>0?Math.min(100,(outSum/dailyBudget*100)).toFixed(0):0;

  /* 当日明细列表 */
  const rows=recs.map(r=>`
    <div class="todo-item">
      <span style="font-size:18px;">${r.type==='in'?'💰':'🛒'}</span>
      <div class="todo-body">
        <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
          <span class="pill ${r.type==='in'?'b':''}">${r.cat}</span>
          <span class="${r.type==='in'?'amount-in':'amount-out'}">${r.type==='in'?'+':'-'}¥${(+r.amount).toFixed(0)}</span>
        </div>

function quickRecord(){

  accRecords().push({id:uid(),date:state.date,type:_accType,cat:_accCat,amount:+amt.value,note:'',unnecessary:_accType==='out'&&(unn?unn.checked:false)});

function accAdd(type){_accType=type;_accCat=type==='in'?CATS_IN[0]:CATS_OUT[0];renderAll();}
function accEdit(id,k,v){const r=accRecords().find(x=>x.id===id);if(r){r[k]=v;save();if(k==='amount'||k==='unnecessary')renderAll();}}
function accDel(id){db.account.records=accRecords().filter(x=>x.id!==id);save();renderAll();}
function monthRecs(){const m=state.date.slice(0,7);return accRecords().filter(r=>r.date.slice(0,7)===m);}
function monthOutSum(){const m=state.date.slice(0,7);return accRecords().filter(r=>r.date.slice(0,7)===m&&r.type==='out').reduce((a,b)=>a+(+b.amount||0),0);}
function getBudget(){const base=(db.account&&db.account.budget)||3000;return Math.max(0,base-monthOutSum());}
function getDailyBudget(){const b=getBudget();const d=state.date||'';const m=d.slice(0,7);if(!m||!b)return 0;const y=+m.slice(0,4),mo=+m.slice(5,7),day=+d.slice(8,10);const lastDay=new Date(y,mo,0).getDate();const remaining=Math.max(1,lastDay-day+1);return Math.round(b/remaining);}
function setBudgetPrompt(){
  const cur=getBudget();
  const v=prompt('设置本月预算（元）：',String(cur));
  if(v===null)return;
  const n=parseFloat(v);
  if(isNaN(n)||n<0){alert('请输入有效数字哦～');return;}
  if(!db.account)db.account={};
  db.account.budget=n;save();renderAll();
}

function renderAccMonth(){
  const recs=monthRecs();const m=state.date.slice(0,7);
  const inSum=recs.filter(r=>r.type==='in').reduce((a,b)=>a+ +b.amount,0);
  const outSum=recs.filter(r=>r.type==='out').reduce((a,b)=>a+ +b.amount,0);
  const byCat={};recs.filter(r=>r.type==='out').forEach(r=>{byCat[r.cat]=(byCat[r.cat]||0)+ +r.amount;});
  const maxCat=Math.max(1,...Object.values(byCat));
  const catBars=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`
    <div class="bar-row"><span class="bar-label">${c}</span>
    <div class="bar-track"><div class="bar-fill" style="width:${(v/maxCat*100).toFixed(1)}%"></div></div>
    <span class="bar-val">¥${v.toFixed(0)}</span></div>`).join('')||'<div class="empty-tip">本月还没有支出记录～</div>';
  const days=new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();
  const byDay=Array(days).fill(0);
  recs.filter(r=>r.type==='out').forEach(r=>{byDay[+r.date.slice(8,10)-1]+= +r.amount;});
  const maxDay=Math.max(1,...byDay);
  const dayChart=byDay.map((v,i)=>`<div class="day-col"><div class="day-bar" style="height:${(v/maxDay*70).toFixed(0)}px" title="¥${v}"></div><div class="day-num">${i+1}</div></div>`).join('');
  return `
  <div class="stat-grid">
    <div class="stat-box"><div class="stat-num amount-in">¥${inSum.toFixed(0)}</div><div class="stat-lab">${m} 收入</div></div>
    <div class="stat-box"><div class="stat-num amount-out">¥${outSum.toFixed(0)}</div><div class="stat-lab">${m} 支出</div></div>
    <div class="stat-box"><div class="stat-num">¥${(inSum-outSum).toFixed(0)}</div><div class="stat-lab">本月结余</div></div>
  </div>

  <div class="card"><div class="card-title">📈 每日支出走势</div><div class="day-chart">${dayChart}</div></div>`;
}

function renderAccBudget(){
  if(!db.account)db.account={};if(!db.account.budgets)db.account.budgets={};
  const recs=monthRecs().filter(r=>r.type==='out');
  const spent={};recs.forEach(r=>{spent[r.cat]=(spent[r.cat]||0)+ +r.amount;});
  const rows=CATS_OUT.map(c=>{
    const limit=+(db.account.budgets[c]||0),used=spent[c]||0;

    return `<div style="margin-bottom:14px;">

      </div>

      <div style="font-size:10px;color:${over?'var(--red)':'var(--sub)'};margin-top:3px;">已用 ¥${used.toFixed(0)}${limit?' / ¥'+limit+(over?'　💥 超支啦！':pct>80?'　⚠️ 快到上限咯':'　✨ 控制得不错'):'（未设置上限）'}</div>
    </div>`;
  }).join('');

function budgetSet(c,v){db.account.budgets[c]=v;save();renderAll();}

function renderAccReview(){
  const m=state.date.slice(0,7);const recs=monthRecs();
  const inSum=recs.filter(r=>r.type==='in').reduce((a,b)=>a+ +b.amount,0);
  const outSum=recs.filter(r=>r.type==='out').reduce((a,b)=>a+ +b.amount,0);
  const unn=recs.filter(r=>r.type==='out'&&r.unnecessary);
  const unnSum=unn.reduce((a,b)=>a+ +b.amount,0);
  const byCat={};recs.filter(r=>r.type==='out').forEach(r=>{byCat[r.cat]=(byCat[r.cat]||0)+ +r.amount;});
  const top=Object.entries(byCat).sort((a,b)=>b[1]-a[1])[0];
  const saving=inSum-outSum;
  let auto=`🌸 ${m} 月消费小结（根据每月消费记录自动更新）\n`;
  auto+=`\n💰 存钱情况：本月收入 ¥${inSum.toFixed(0)}，支出 ¥${outSum.toFixed(0)}，${saving>=0?`成功存下 ¥${saving.toFixed(0)}，棒棒哒！🎉`:`超支 ¥${(-saving).toFixed(0)}，下个月要加油控制哦 🥺`}`;
  if(top) auto+=`\n\n🏆 花钱最多的类目：${top[0]}（¥${top[1].toFixed(0)}，占支出 ${(top[1]/Math.max(1,outSum)*100).toFixed(0)}%）`;
  auto+=`\n\n🙈 不必要消费：共 ${unn.length} 笔、合计 ¥${unnSum.toFixed(0)}${unnSum>0?`，如果忍住的话能多存 ¥${unnSum.toFixed(0)} 呢～`:'，本月零不必要消费，太自律啦！👏'}`;
  if(unn.length) auto+=`\n清单：${unn.map(r=>`${r.cat.replace(/^\S+\s/,'')}¥${r.amount}${r.note?'('+r.note+')':''}`).join('、')}`;
  const myNote=get(['account','review',m],'');
  return `
  <div class="card"><div class="card-title">🔍 ${m} 自动复盘 <span class="tag">每日记账后自动刷新</span></div>
    <div style="white-space:pre-wrap;font-size:13px;line-height:1.8;background:#FBF7FA;border-radius:var(--r-md);padding:12px;">${esc(auto)}</div>
  </div>
  <div class="card"><div class="card-title">✍️ 我的复盘手记 <span class="tag">可编辑</span></div>
    <textarea class="f-area" style="min-height:110px" placeholder="这个月的钱花得值不值？写写感想吧～" onchange="set(['account','review','${m}'],this.value)">${esc(myNote)}</textarea>
  </div>`;
}

function latestWeight(){const l=(db.body||[]);const last=l[l.length-1];return last&&+last.weight?+last.weight:55;}
function calcKcal(mins,hr){
  const w=latestWeight();
  const perMin=(-20.4022+0.4472*hr-0.1263*w+0.074*25)/4.184;
  return Math.max(0,Math.round(perMin*mins));
}

  </div>

      <div class="f-row"><span class="f-label">食物名称（自动检索热量库）</span><input class="f-input" value="${esc(f.name)}" placeholder="如：米饭 / 奶茶 / 鸡胸肉" onchange="calFoodEdit('${f.id}','name',this.value)"></div>
      <div class="grid2">
        <div class="f-row"><span class="f-label">分量 (g/ml)</span><input class="f-input" type="number" value="${esc(f.grams)}" onchange="calFoodEdit('${f.id}','grams',this.value)"></div>
        <div class="f-row"><span class="f-label">每100g热量</span><input class="f-input" type="number" value="${esc(f.per100)}" onchange="calFoodEdit('${f.id}','per100',this.value)"></div>
      </div>
      <div style="font-size:13px;font-weight:800;color:var(--red);">🔥 本项热量：${f.kcal||0} kcal ${f.auto?'<span class="pill b">已自动写入</span>':''}</div>
    </div>`).join('')||'<div class="empty-tip">添加食物，热量自动帮你查 🔍</div>';
  return `
  <div class="stat-grid">
    <div class="stat-box"><div class="stat-num">${d.foods.length}</div><div class="stat-lab">食物条目</div></div>

function calFoodAdd(meal){calData().foods.push({id:uid(),name:'',grams:100,per100:0,kcal:0,auto:false,meal:meal||''});save();renderAll();}
function calFoodEdit(id,k,v){
  const f=calData().foods.find(x=>x.id===id);if(!f)return;
  f[k]=v;
  if(k==='name'){
    const hit=Object.keys(FOOD_DB).find(n=>v.includes(n)||n.includes(v));
    if(hit&&v.trim()){f.per100=FOOD_DB[hit];f.auto=true;}else{f.auto=false;}
  }
  f.kcal=Math.round((+f.grams||0)*(+f.per100||0)/100);
  save();renderAll();
}
function calFoodDel(id){const d=calData();d.foods=d.foods.filter(x=>x.id!==id);save();renderAll();}

function achData(){if(!db.achieve)db.achieve={};if(!db.achieve[state.date])db.achieve[state.date]={items:[]};return db.achieve[state.date];}
function renderAchieve(){
  const a=achData();
  const cards=[...a.items].reverse().map(it=>`
    <div class="rec-card">
      <div class="rec-head"><span class="rec-date">🗓 ${esc(it.date||state.date)} <input class="todo-time" type="time" style="width:auto" value="${esc(it.time||'')}" onchange="achEdit('${it.id}','time',this.value)"></span><button class="del-btn" onclick="achDel('${it.id}')">✕</button></div>
      <div class="photo-box" onclick="pickPhoto('setAchPhoto_${it.id}')">${it.photo?`<img src="${it.photo}">`:'📷 拍下今天的小成果'}</div>
      <div class="f-row" style="margin-top:8px;"><input class="f-input" value="${esc(it.text||'')}" placeholder="今天达成了什么呀～" onchange="achEdit('${it.id}','text',this.value)"></div>
      <input class="sup-note" value="${esc(it.note||'')}" placeholder="备注小字（心情/感想）" onchange="achEdit('${it.id}','note',this.value)">
      ${it.photo?`<button class="mini-btn" style="margin-top:8px" onclick="achEdit('${it.id}','photo','');renderAll()">🗑 删除照片</button>`:''}
    </div>`).join('')||`<div class="rec-card">
      <div class="rec-head"><span class="rec-date">🗓 ${state.date}</span></div>
      <div class="photo-box" onclick="achAddPhotoDirect()">📷 拍下今天的小成果</div>
      <div class="f-row" style="margin-top:8px;"><input class="f-input" placeholder="今天达成了什么呀～" onchange="achNew('text',this.value)"></div>
      <input class="sup-note" placeholder="备注小字（心情/感想）" onchange="achNew('note',this.value)">
    </div>`;
  return `
  <div class="stat-grid">
    <div class="stat-box"><div class="stat-num">🏆 ${a.items.length}</div><div class="stat-lab">今日成果数</div></div>
    <div class="stat-box"><div class="stat-num">${a.items.filter(x=>x.photo).length}</div><div class="stat-lab">照片记录</div></div>
    <div class="stat-box"><div class="stat-num">${a.items.length?'😋':'🐣'}</div><div class="stat-lab">${a.items.length?'今天也超棒！':'等你解锁'}</div></div>
  </div>
  <div class="card"><div class="card-title">🏆 今日成果 <span class="tag">${state.date} · 拍照记录</span></div>
    ${cards}
    ${a.items.length?`<button class="add-btn-grad" style="margin-top:4px" onclick="achAdd()">📷 ＋ 再记录一个成果</button>`:''}
    <div class="hint">💡 直接拍照或输入即可记录；每天独立存档，可用顶部「🗑 删除当天记录」清理。</div>
  </div>`;
}
function achNew(k,v){
  if(k==='text'&&!String(v).trim())return;
  const it={id:uid(),date:state.date,time:nowTime(),text:'',note:'',photo:''};it[k]=v;
  achData().items.push(it);save();
  window['setAchPhoto_'+it.id]=(data)=>{it.photo=data;save();renderAll();};
  renderAll();
}
function achAddPhotoDirect(){
  const it={id:uid(),date:state.date,time:nowTime(),text:'',note:'',photo:''};
  achData().items.push(it);save();
  window['setAchPhoto_'+it.id]=(data)=>{it.photo=data;save();renderAll();};
  pickPhoto('setAchPhoto_'+it.id);renderAll();
}
function achAdd(){
  const it={id:uid(),date:state.date,time:nowTime(),text:'',note:'',photo:''};
  achData().items.push(it);save();
  window['setAchPhoto_'+it.id]=(data)=>{achEdit(it.id,'photo',data);renderAll();};
  renderAll();
}
function achEdit(id,k,v){const it=achData().items.find(x=>x.id===id);if(it){it[k]=v;save();}}
function achDel(id){const a=achData();a.items=a.items.filter(x=>x.id!==id);save();renderAll();}
/* 恢复已有成果条目的拍照回调 */
function achBindPhotoCbs(){
  if(!db.achieve)return;
  for(const d of Object.values(db.achieve)){
    for(const it of (d.items||[])){
      window['setAchPhoto_'+it.id]=(data)=>{it.photo=data;save();renderAll();};
    }
  }
}
achBindPhotoCbs();

'命运之轮':{kw:'10号牌 · 转机 · 循环 · 时机 · 顺势',up:'轮子在转，运势正在换方向——通常是往好的那边。抓住突然出现的机会，此刻的「巧合」其实是命运的安排。顺势而为，别硬拗。',down:'时运下行、计划被打乱，或反复卡在同一个坑里。这是周期的低点，不是终点，耐心等轮子转过去。',lu:'缘分突然到来或关系出现转折。命中注定的感觉很强。',ld:'错过时机、聚散无常。有些人只能陪一段路。',wu:'意外机遇、贵人牵线，形势对你有利。',wd:'变动带来动荡，计划赶不上变化。先稳住再说。',mu:'偏财运不错，投机性收益有机会。',md:'起伏剧烈、盈亏不定，不宜追高。'},
'正义':{kw:'11号牌 · 公平 · 因果 · 真相 · 权衡',up:'天平和剑，讲的是「一切都会被算清楚」。做决定要理性、要诚实，法律、合约、考核类事务对你有利。你种下的因，正在结果。',down:'失衡、偏颇、逃避责任。也可能遭遇不公，或自己在钻空子。诚实面对才能解开死结。',lu:'关系公平对等，也可能涉及法律层面（登记、协议）。',ld:'付出与回报不成正比，或有欺瞒。该算清楚的要算清楚。',wu:'考核、面试、评审顺利，你的努力会被公正对待。',wd:'遭遇偏袒或背锅，也要反省自己是否有疏漏。',mu:'收支平衡，账目清晰。适合处理税务、合约。',md:'罚款、纠纷、赔偿。合同条款务必看仔细。'},
'倒吊人':{kw:'12号牌 · 停顿 · 换位思考 · 牺牲 · 领悟',up:'倒挂着，却面带平静——因为换个角度，世界完全不同。这是主动的暂停：有些事现在推不动，不如放下执念，等一个新视角。牺牲短期利益换长期领悟，值得。',down:'无谓的自我牺牲，或被困住动弹不得。你在为不值得的人事消耗自己。也可能是拒绝改变视角，越拧越死。',lu:'单方面付出或感情停滞。学会等待，也要学会止损。',ld:'为爱委屈自己太久，感动的只有你一个。',wu:'项目搁置、进度冻结。此时的沉淀会在未来兑现。',wd:'白费力气、方向错误，及时抽身好过硬耗。',mu:'资金被套牢或需要长期投入才见效。',md:'投入打水漂，或现金流被卡住。'},
'死神':{kw:'13号牌 · 结束 · 蜕变 · 断舍离 · 重生',up:'不是死亡，是「必须结束才能重新开始」。一段关系、一份工作、一种旧的自己正在退场。抗拒只会更痛，放手才有蜕变。清理掉不再适合你的东西吧。',down:'死死抓住不放，让痛苦无限延长。改变已经发生了，只是你还没承认。也可能是恐惧变化而原地打转。',lu:'关系走到尽头，或彻底转变形态（朋友转恋人、分手复合）。',ld:'拖泥带水的分离，念念不忘却回不去。',wu:'离职、转型、结束一个阶段。旧门关上，新门才开。',wd:'被迫接受变动，或不肯离开明显不合适的位置。',mu:'财务结构需要清理，砍掉无效支出。',md:'损失难免，但及时止损才是明智。'},
'节制':{kw:'14号牌 · 平衡 · 调和 · 中庸 · 耐心',up:'天使在两个杯子间倒水，不多不少刚刚好。这是关于「配比」的牌：工作与生活、理性与感性、给予与接受。慢慢来，比较快。也有疗愈、康复的意涵。',down:'失衡与极端——太急、太多、太满。也可能是两方难以调和，或缺乏耐心导致前功尽弃。',lu:'关系温和融洽，彼此调适得当。适合修复和磨合。',ld:'节奏不同步，一方太急一方太慢。',wu:'跨部门协调顺利，多线任务能兼顾。',wd:'顾此失彼、资源分配失当。',mu:'收支调配得宜，稳中有进。',md:'入不敷出或极端理财（过度激进/过度保守）。'},
'恶魔':{kw:'15号牌 · 束缚 · 欲望 · 执念 · 阴影',up:'两个人被链子拴着，但链子其实是松的——枷锁是自己戴上的。看清什么让你上瘾：一段关系、一个习惯、一种恐惧。承认它，是挣脱的第一步。也可指强烈的肉体吸引。',down:'正在觉醒和松绑，链子开始松动。你比自己想象的更自由。但也要防止旧瘾复发。',lu:'强烈的吸引力，但可能是控制、依赖或不健康的纠缠。',ld:'正在脱离有毒关系，或看清了真相。恭喜，你要自由了。',wu:'为了利益忍受不喜欢的环境，或工作让你上瘾到失衡。',wd:'终于敢辞掉那份消耗你的工作，或摆脱职场PUA。',mu:'物质欲望驱动，赚钱能力强但也花得凶。',md:'债务、赌性、被套牢。断掉那个吸血的口子。'},
'高塔':{kw:'16号牌 · 突变 · 崩塌 · 觉醒 · 破而后立',up:'闪电劈中高塔，一切建立在虚假地基上的东西轰然倒下。突发、震撼、措手不及——但塌掉的都是本就该塌的。废墟之上，你会更真实。',down:'危机延迟或勉强维持，用胶带糊住裂缝。主动拆掉，好过等它砸下来。也可能是灾难被避开了，虚惊一场。',lu:'关系突然破裂或真相曝光。痛，但清醒。',ld:'摇摇欲坠却不肯放手，拖着只会更难看。',wu:'突发变动：裁员、项目叫停、组织重整。混乱中藏着新机会。',wd:'危机暂时压住，但根本问题还在。',mu:'突发损失、意外支出。留好应急金。',md:'勉强撑住的财务状况，需要根本性调整。'},
'星星':{kw:'17号牌 · 希望 · 疗愈 · 灵感 · 指引',up:'高塔之后是星空。这是一张温柔的牌：伤口在愈合，希望在回来，灵感如泉涌。宇宙正在悄悄帮你。保持信念，你走在对的路上。',down:'信心动摇、灵感枯竭、觉得努力没有意义。别忘了抬头——星星一直都在，只是被云遮住了。',lu:'纯净美好的感情，疗愈系的关系。远距离也能心意相通。',ld:'对爱失去信心，或期待落空。给自己一点时间。',wu:'创意迸发、前景光明，你的作品会被看见。',wd:'迷茫失焦、看不到方向。休息一下再出发。',mu:'财运缓慢回升，长期看好。',md:'期望过高而失望，或投资回报不如预期。'},
'月亮':{kw:'18号牌 · 潜意识 · 幻象 · 不安 · 直觉',up:'月光下什么都看不真切。这是一张关于「迷雾」的牌：焦虑、多疑、梦境、说不清的不安。事情未必如表面所见，但也别被恐惧牵着走。相信直觉，但要验证。',down:'迷雾正在散去，真相浮现，焦虑消退。也可能是仍在自欺欺人，不愿看清。',lu:'暧昧不明、猜疑内耗，或有隐情未说。',ld:'误会解开，或看清了对方的真面目。',wu:'信息不透明、暗流涌动。别轻信小道消息。',wd:'真相水落石出，问题开始明朗。',mu:'财务状况不清晰，账目需要理一理。',md:'隐藏的风险浮出水面，及时处理还来得及。'},
'太阳':{kw:'19号牌 · 喜悦 · 成功 · 活力 · 坦率',up:'最明亮的一张牌。成功、被爱、被看见，一切都在阳光下清清楚楚。适合展现自己、庆祝、做让你开心的事。也象征小孩、生育、纯粹的快乐。',down:'快乐延迟或打了折扣，能量偏低。乌云会散的，只是需要点时间。也提醒别过度乐观。',lu:'阳光甜蜜的关系，公开、被祝福。有喜讯。',ld:'热度下降或关系需要更多真诚。',wu:'成果显著、备受肯定，是收获期。',wd:'成就感不足，或成功来得比预期慢。',mu:'财运旺盛，收入增加，投资顺利。',md:'收益不如预期，或乐观过头而失算。'},
'审判':{kw:'20号牌 · 觉醒 · 召唤 · 清算 · 重生',up:'号角响起，过去的一切被摆上台面。这是「结算与召唤」的时刻：旧账被了结，使命感浮现，你听见了内心的召唤。也常指旧人旧事的回归。',down:'自我批判过度，或忽视了内心的呼唤。也可能是逃避清算、活在悔恨里。宽恕自己，才能往前走。',lu:'旧情复燃或关系进入新阶段。该说清楚的说清楚。',ld:'困在过去的遗憾里，或不愿面对关系的真相。',wu:'努力被看见，升迁、复出、转折点到来。',wd:'错过机会或被过去的失误拖累。',mu:'财务清算，旧债旧账有了结果。',md:'为过去的决定买单，需要重新规划。'},
'世界':{kw:'21号牌 · 圆满 · 完成 · 整合 · 新循环',up:'大功告成的牌。一个阶段圆满收官，你走完了整段旅程并且成为了更完整的自己。适合毕业、结业、达成目标、出国远行。庆祝吧，然后开始新的一圈。',down:'临门一脚没完成，或形式上结束了但心里没有闭环。再坚持一下，或者诚实承认哪里还没做完。',lu:'关系圆满，走向长久承诺。异国、异地恋也有好结果。',ld:'差一点点的遗憾，或关系停在原地无法升级。',wu:'项目成功交付，目标达成。适合拓展海外、更大的舞台。',wd:'收尾拖延、成果打折。别在最后一步松懈。',mu:'财务目标达成，收获丰厚。',md:'迟迟未能变现，或成果与投入不成正比。'},
/* ── 权杖 Wands · 火 · 行动与热情 ── */
'权杖一':{kw:'火元素 · 新机遇 · 灵感火花 · 原始动力',up:'一只手从云中递出发芽的木杖——机会以「冲动」的形式降临。这是一切开始前的那股热血：新项目、新念头、新的性冲动。别分析太多，热情本身就是信号。',down:'火苗被浇灭：起步受挫、动力不足，或想法迟迟无法落地。也可能是热情用错了地方。',lu:'一见钟情、强烈吸引，关系有性张力。适合主动出击。',ld:'热度来得快去得快，或表白被拒。',wu:'新项目启动、创业念头萌芽，斗志满满。',wd:'计划流产、审批卡关，或提不起劲。',mu:'新财源出现，投资的好起点。',md:'投入了却没回响，先别加码。'},
'权杖二':{kw:'规划 · 展望 · 权衡 · 掌握全局',up:'手握地球站在城墙上——已经有了成果，正在思考下一步往哪走。这是「谋定而后动」的阶段：视野打开了，选项也多了，该做战略选择了。',down:'想太多而不行动，或格局太小只看眼前。也可能是计划赶不上变化，被打乱节奏。',lu:'考虑关系的未来走向，或在两个人之间权衡。',ld:'犹豫不决错过时机，或对未来没有共识。',wu:'适合做规划、谈合作、拓展版图。',wd:'方案反复修改却不落地，错失先机。',mu:'资产配置的好时机，眼光放长远。',md:'瞻前顾后错过入场，或计划不周。'},
'权杖三':{kw:'远见 · 等待收获 · 拓展 · 贸易',up:'站在高处望着远方的船——布局已经完成，现在等船靠岸。你的努力开始有回响，尤其在跨界、外地、海外方面。视野越宽，收获越大。',down:'目光短浅、错失良机，或等待的东西迟迟不来。也可能是扩张过快超出能力范围。',lu:'异地恋有进展，或关系进入稳定期等待开花。',ld:'久等无果，或对方在远方而心也远了。',wu:'业务拓展顺利，海外/异地机会不错。',wd:'合作延误、进度滞后。',mu:'投资开始见效，长线看好。',md:'回报迟迟不来，资金周转吃紧。'},
'权杖四':{kw:'庆祝 · 稳固 · 归属 · 阶段成果',up:'花环搭起的凉亭下，大家在庆祝。这是「值得开心一下」的牌：阶段性成果达成、家庭和睦、乔迁之喜、婚礼。稳固的基础已经建好了。',down:'庆祝被推迟，或表面和谐内里松动。也可能是待在舒适圈太久，该往前走了。',lu:'关系稳定，有同居、订婚、见家长的可能。',ld:'关系停滞，或家庭因素造成阻碍。',wu:'团队氛围好，项目告一段落值得庆功。',wd:'成果不如预期，或团队暗流涌动。',mu:'财务稳定，适合置产、装修。',md:'大额支出（搬家、婚庆）造成压力。'},
'权杖五':{kw:'竞争 · 冲突 · 混战 · 磨练',up:'五个人挥舞木杖，看似打架其实更像切磋。这是一张「良性竞争」的牌：环境嘈杂、对手众多，但摩擦会让你变强。别怕正面交锋。',down:'无谓的内耗、恶性竞争，或逃避冲突导致问题积压。也可能是冲突终于平息。',lu:'情敌出现，或两人经常拌嘴。吵架也是一种沟通。',ld:'冷战、消极对抗，或争执终于结束。',wu:'职场竞争激烈，但你有实力。团队意见不合需要磨合。',wd:'内斗消耗、勾心斗角，或被排挤。',mu:'为钱起争执，或收入需要靠竞争获取。',md:'财务纠纷、分配不均。'},
'权杖六':{kw:'凯旋 · 认可 · 荣耀 · 领导',up:'戴着桂冠骑马归来，众人簇拥。努力被看见了，你赢得了应有的掌声。适合公开发表、领奖、汇报成果。也象征好消息传来。',down:'荣誉迟到或被抢走，也可能是骄傲自满、名不副实。低调一点没坏处。',lu:'关系被祝福，或成为对方的骄傲。',ld:'付出没被看见，或在关系中失去自信。',wu:'升职加薪、项目获奖、当众被表扬。',wd:'功劳被冒领，或成果不被认可。',mu:'收入提升，有奖金或额外报酬。',md:'期待的回报落空。'},
'权杖七':{kw:'捍卫 · 坚守 · 以寡敌众 · 立场',up:'站在高处以一敌六，占据地利。这是「为自己而战」的牌：有人挑战你的位置，但你有优势。守住底线，别退让。',down:'孤军奋战到力竭，或放弃了本该坚持的东西。适时求助不是示弱。',lu:'需要为这段关系争取，或面对外界压力。',ld:'守不住了，或不值得再守。',wu:'面对竞争压力但能守住地位，坚持你的方案。',wd:'招架不住、被挤下位置，或过度防御树敌。',mu:'守财成功，抵御住了风险。',md:'财务防线失守，压力增大。'},
'权杖八':{kw:'迅速 · 消息 · 进展 · 一触即发',up:'八根木杖破空飞行——事情突然加速。消息传来、进度飞快、旅行成行。适合快速沟通和当机立断，此刻的效率是平时的三倍。',down:'延误、误传、信息混乱。或者太急躁导致出错。先理清再动。',lu:'感情快速升温，告白或表白信来了。',ld:'联系突然中断，或消息石沉大海。',wu:'项目进度飞快，沟通顺畅，出差在即。',wd:'沟通失误、进度受阻、行程取消。',mu:'资金快速到位，回款顺利。',md:'款项延迟、财务信息混乱。'},
'权杖九':{kw:'坚持 · 戒备 · 最后关卡 · 疲惫但未倒',up:'带着伤仍握紧木杖——你已经撑到很后面了，只差最后一哆嗦。保持警惕，但也要相信自己扛得住。经验让你更强韧。',down:'真的撑不住了，或过度防备把人都推开了。该休息就休息，硬扛不是勇敢。',lu:'因过去的伤害而戒备，不敢再靠近。',ld:'身心俱疲的关系，或防备心太重错过好人。',wu:'最后攻坚阶段，咬牙撑过就好。',wd:'精疲力竭、濒临放弃。',mu:'勉强维持但底子还在。',md:'财务吃紧，需要外部支援。'},
'权杖十':{kw:'重担 · 超载 · 责任 · 快到终点',up:'抱着十根木杖艰难前行，目标就在前方却压得喘不过气。你揽了太多在身上。学会分担和取舍，不是所有事都必须你做。',down:'彻底压垮，或终于放下了不属于你的负担。卸下来的那一刻会轻松很多。',lu:'关系变成负担，责任大于快乐。',ld:'终于放下，或被压力压垮而分开。',wu:'工作量爆表、责任过重。学会说不、学会授权。',wd:'崩溃边缘或主动卸责。适当放手。',mu:'经济负担沉重，多重支出压身。',md:'债务缠身，需要重组财务。'},
'权杖侍从':{kw:'热情新手 · 好奇 · 消息 · 跃跃欲试',up:'年轻人举着木杖仔细端详——充满好奇和探索欲。会有令人兴奋的新消息，或遇到一个热情洋溢的年轻人。适合尝试新事物，不怕做得不完美。',down:'三分钟热度、浮躁不定，或坏消息传来。先把一件事做完再说。',lu:'青涩热烈的追求，或收到示好的信号。',ld:'不成熟的感情、玩玩而已。',wu:'新任务、新学习机会，态度积极。',wd:'眼高手低、频繁换方向。',mu:'小额新收入或赚钱新点子。',md:'冲动消费、投资太随意。'},
'权杖骑士':{kw:'行动 · 冒险 · 激情 · 全速前进',up:'骑马腾跃，一往无前。行动力拉满的状态：说走就走的旅行、雷厉风行的执行、热烈直接的追求。冲吧，此刻速度就是优势。',down:'鲁莽冒进、有始无终，或情绪化的爆冲。快不等于对，偶尔踩刹车。',lu:'热烈直接的追求者，激情满满但未必长久。',ld:'忽冷忽热、不负责任，或感情来去如风。',wu:'执行力强、推进迅速，适合开拓型任务。',wd:'急于求成而出错，或半途而废。',mu:'大胆投资有回报，但风险也高。',md:'冲动决策导致亏损。'},
'权杖王后':{kw:'自信 · 魅力 · 热情 · 社交能量',up:'坐在王座上，脚边一只黑猫——自信、有魅力、能量感染力强。你就是那个让场子热起来的人。适合社交、演讲、带团队，别藏着你的光。',down:'霸道强势、控制欲强，或嫉妒心作祟。也可能是自信崩塌、能量低迷。',lu:'魅力四射，桃花旺。关系中你是主导的一方。',ld:'占有欲过强，或因妒生怨。',wu:'领导力和亲和力兼备，团队愿意跟你走。',wd:'情绪影响判断，或与人争锋相对。',mu:'靠人脉和魅力生财。',md:'为面子花钱，或情绪化消费。'},
'权杖国王':{kw:'领导 · 远见 · 魄力 · 事业格局',up:'成熟的掌舵者，有愿景也有执行力。这是「大局在握」的状态：能带人、能拍板、能扛事。也可能指向一位有魄力的成熟男性。',down:'独断专行、听不进意见，或空有野心没有落实。权威需要靠服人而非压人。',lu:'成熟可靠的伴侣，有担当。但可能太强势。',ld:'大男子主义、控制欲强，或口头承诺不兑现。',wu:'掌控全局、领导有方，适合创业和管理。',wd:'刚愎自用导致团队离心。',mu:'事业带来丰厚财富，格局大收益大。',md:'野心超出能力，扩张过度。'},
/* ── 圣杯 Cups · 水 · 情感与关系 ── */
'圣杯一':{kw:'水元素 · 新感情 · 情感涌现 · 心的开启',up:'云中之手托起满溢的圣杯——爱正在涌来。新恋情、新的情感体验、创作灵感、内心被填满的感觉。打开心，接住它。',down:'情感封闭、拒绝接受爱，或感情落空、内心空虚。心门是从里面锁上的。',lu:'新恋情开始，或现有关系注入新的爱意。告白吉。',ld:'单相思、错过、不敢投入。',wu:'对工作重燃热情，或创作灵感涌现。',wd:'提不起劲，工作缺乏情感联结。',mu:'因心之所向而得财，做喜欢的事有回报。',md:'情绪影响财务判断。'},
'圣杯二':{kw:'联结 · 互相吸引 · 伙伴 · 对等之爱',up:'两人交换圣杯，中间是治愈的符号。这是「双向奔赴」的牌：彼此吸引、相互尊重、灵魂共振。合作与和解也很顺利。',down:'关系失衡、单方面付出，或误会导致裂痕。爱不该是独角戏。',lu:'最好的感情牌之一：两情相悦、彼此珍惜，有定情之意。',ld:'一头热、不对等，或分手边缘。',wu:'合作愉快，找到对的搭档。',wd:'合伙不同心，理念不合。',mu:'因合作或伴侣而得财。',md:'金钱上的不对等造成矛盾。'},
'圣杯三':{kw:'欢庆 · 友谊 · 分享 · 社群',up:'三人举杯共舞——快乐是需要分享的。聚会、庆祝、闺蜜情深、团队默契。此刻你被善意包围着，尽情享受。',down:'社交疲惫、表面热闹，或三角关系、闲言碎语。热闹之后的空虚需要看见。',lu:'关系被朋友祝福，或在社交场合遇到缘分。小心第三者。',ld:'因外人介入生变，或社交消耗了感情。',wu:'团队合作愉快，庆功时刻。',wd:'办公室政治、八卦是非。',mu:'因人脉而得财，适合合资。',md:'社交花销过大。'},
'圣杯四':{kw:'倦怠 · 沉思 · 视而不见 · 重新评估',up:'坐在树下对递来的杯子无动于衷——拥有的很多，却感觉不到快乐。这是「情感倦怠期」：不是没有机会，是你没看见。抬头看看。',down:'走出倦怠、重新接受，或彻底陷入麻木。也可能是终于愿意抓住机会了。',lu:'对现有关系厌倦，或对示好无感。',ld:'走出低潮愿意再爱，或彻底关闭心门。',wu:'工作提不起劲，觉得一切重复。',wd:'重燃兴趣，或决定换个环境。',mu:'对现有收入不满足但也不行动。',md:'错失财务机会。'},
'圣杯五':{kw:'失落 · 遗憾 · 哀悼 · 尚有余存',up:'三个杯子倒了，但身后还有两个立着。这是「悲伤但未至绝境」的牌：损失确实发生了，请允许自己难过——然后记得回头看看剩下的。',down:'走出悲伤、开始释怀，或仍然沉溺无法自拔。转身就能看见希望。',lu:'失恋、遗憾、后悔。但故事还没完。',ld:'慢慢走出来，或终于放下执念。',wu:'项目失利、结果不如预期。',wd:'从挫折中恢复，或困在失败里。',mu:'有损失但不至于全盘皆输。',md:'为失去的钱耿耿于怀，影响后续判断。'},
'圣杯六':{kw:'回忆 · 童年 · 纯真 · 旧人旧事',up:'孩子递花给另一个孩子——温暖、纯粹、不带算计。过去的美好正在滋养你，或有故人重逢、旧地重游。也象征来自童年的礼物。',down:'活在过去、无法前行，或被回忆美化了的东西困住。回忆是用来珍藏的，不是用来住的。',lu:'旧情复燃、青梅竹马，或纯真的感情。',ld:'忘不掉前任，拿现在的人和过去比。',wu:'老同事老关系带来机会，或回到熟悉的领域。',wd:'固守旧方法，跟不上变化。',mu:'家人资助或旧投资有回报。',md:'为怀旧花冤枉钱。'},
'圣杯七':{kw:'选择 · 幻想 · 诱惑 · 眼花缭乱',up:'云中浮现七个杯子，装着财富、爱情、荣耀……都很诱人，但有些是幻象。选项太多反而难选。分清「想象的」和「真实的」。',down:'看清现实、做出选择，或彻底迷失在幻想里。脚踏实地，选一条走到底。',lu:'选择太多难以定心，或对方只是你的想象。',ld:'认清现实，或幻想破灭。',wu:'机会很多但要甄别，别被画饼骗了。',wd:'终于聚焦，或计划全是空想。',mu:'投资选项多但需谨慎，警惕高回报陷阱。',md:'被虚假项目吸引，或空想发财。'},
'圣杯八':{kw:'离开 · 转身 · 追寻更深 · 主动放下',up:'背对八个杯子走向远山——明明拥有却选择离开，因为知道那不是你要的。这是有勇气的告别：为了更重要的东西，放弃眼前的安稳。',down:'想走又走不掉，反复回头。或漫无目的地逃离。搞清楚你是在追寻还是在逃避。',lu:'主动结束一段关系，或为了成长而分开。',ld:'藕断丝连，走不干净。',wu:'辞职、转行，去追寻更有意义的事。',wd:'想走不敢走，在原地耗着。',mu:'放弃眼前小利换长远收益。',md:'舍不得沉没成本，越陷越深。'},
'圣杯九':{kw:'愿望成真 · 满足 · 享受 · 心愿之牌',up:'被称为「愿望牌」——抱臂而坐，身后九杯排开，一副心满意足的样子。你想要的正在实现。享受这份满足，你值得。',down:'愿望落空或得到了却不开心。也可能是贪得无厌、只顾享乐。',lu:'感情如愿以偿，甜蜜满足。',ld:'期待落空，或关系流于表面享乐。',wu:'目标达成，工作带来成就感。',wd:'成果不如预期，或自满停滞。',mu:'财运极佳，愿望清单可以实现了。',md:'挥霍无度，或空欢喜一场。'},
'圣杯十':{kw:'圆满 · 家庭 · 幸福 · 情感巅峰',up:'彩虹下一家人张开双臂——情感层面最圆满的牌。家庭和乐、关系稳固、被爱包围。这不是激情，是踏实的幸福感。',down:'家庭失和、表面完美内里空洞，或对幸福的定义被他人绑架。',lu:'走向婚姻和家庭，长久幸福。',ld:'貌合神离，或家庭因素造成压力。',wu:'工作与生活平衡，团队像家人。',wd:'工作影响家庭，或团队貌合神离。',mu:'家庭财务稳固，共同资产增长。',md:'家庭开销大，或因钱伤感情。'},
'圣杯侍从':{kw:'纯真情感 · 直觉 · 创意萌芽 · 好消息',up:'杯中跳出一条鱼——意料之外的灵感和情感讯息。会收到甜蜜的消息、示好的信号，或冒出天马行空的创意。相信第一直觉。',down:'情绪化、玻璃心，或消息落空。天真是好事，但也要有保护自己的能力。',lu:'收到告白或暧昧信号，青涩美好。',ld:'不成熟的感情，或被辜负。',wu:'创意萌芽期，适合尝试新表达。',wd:'想法不切实际，或情绪影响工作。',mu:'小惊喜、小红包。',md:'因情绪或直觉乱花钱。'},
'圣杯骑士':{kw:'浪漫 · 追求 · 深情 · 理想主义者',up:'骑白马缓缓前行，手捧圣杯——温柔而坚定的追求者。这是「深情告白」的牌：浪漫邀约、艺术气质、跟随心的指引。',down:'情绪化、忽冷忽热，或用浪漫包装不负责任。也可能是过度理想化对方。',lu:'有人在认真追你，或你该主动示爱了。',ld:'对方只说不做，或感情不稳定。',wu:'适合艺术、创意、需要感染力的工作。',wd:'想法浪漫但落地困难。',mu:'因才华和魅力得财。',md:'为浪漫花钱不理性。'},
'圣杯王后':{kw:'共情 · 温柔 · 直觉深 · 情感容器',up:'凝视杯中的女王——高度敏感、共情力强，能读懂别人没说出口的情绪。你是身边人的情感依靠。也提醒你：温柔是天赋，不是义务。',down:'情绪泛滥、过度共情、被他人情绪吞没。也可能是情感操控或自我封闭。',lu:'深情包容的伴侣，关系温暖治愈。',ld:'情绪内耗，或用眼泪控制对方。',wu:'适合咨询、照护、需要同理心的工作。',wd:'把情绪带进工作，或过度承担他人问题。',mu:'凭直觉理财意外准确。',md:'心软借钱出去，或因情绪乱花。'},
'圣杯国王':{kw:'情感成熟 · 包容 · 沉稳 · 智慧之爱',up:'在波涛中稳坐的国王——情绪成熟到能容纳风浪。懂得爱，也懂得界限。是可以倾诉的对象，也可能指一位温厚可靠的长者。',down:'情感压抑或操控，表面温和内里控制。也可能是情绪失控、借酒消愁。',lu:'成熟稳重的伴侣，给得起安全感。',ld:'情感勒索、若即若离，或压抑真实感受。',wu:'人际处理得当，是团队的定海神针。',wd:'表面和气实则疏离，或用情绪影响他人。',mu:'理性与感性兼顾的财务决策。',md:'因人情往来破财。'},
/* ── 宝剑 Swords · 风 · 思维与沟通 ── */
'宝剑一':{kw:'风元素 · 突破 · 真相 · 思维清晰 · 一刀两断',up:'云中之手举起一把剑，剑尖挑着皇冠——混沌被劈开了。这是「想通了」的瞬间：真相浮现、思路清晰、做出果断决定。有话直说，此刻锋利是优点。',down:'思维混乱、钻牛角尖，或用言语伤人。也可能是有话说不出口，憋成内伤。',lu:'把话说开，关系反而更清楚。也可能是快刀斩乱麻。',ld:'沟通不畅、话不投机，或言语伤害。',wu:'思路清晰、方案获批，适合谈判和决策。',wd:'判断失误、信息错乱。',mu:'看清了财务真相，做对了决定。',md:'误判形势，或合约有陷阱。'},
'宝剑二':{kw:'僵局 · 两难 · 蒙眼 · 逃避决定',up:'蒙着眼交叉双剑——你在回避一个必须做的选择。不看不代表不存在。此刻需要的是摘下眼罩，诚实面对内心真正的倾向。',down:'僵局打破、做出决定，或彻底陷入瘫痪。也可能是被迫摊牌。',lu:'在两人之间摇摆，或对关系装作没看见。',ld:'真相被揭开，或不得不做出选择。',wu:'方案僵持不下，需要有人拍板。',wd:'终于决断，或矛盾激化。',mu:'财务决策拖延，观望中。',md:'拖到错过时机，被动承担损失。'},
'宝剑三':{kw:'心碎 · 伤痛 · 真相之痛 · 必要的割舍',up:'三把剑穿心，背景是雨云。痛是真的，但这种痛来自「终于看清」。伤口需要被承认才能愈合。允许自己哭一场，雨会停的。',down:'正在疗愈，或拒绝面对伤口任其溃烂。也可能是旧伤被重新掀开。',lu:'分离、背叛、争吵带来的伤害。',ld:'慢慢愈合，或困在痛苦里出不来。',wu:'被批评、被否定，或坏消息。',wd:'从打击中恢复，或积怨已久。',mu:'财务损失带来的挫败。',md:'旧账翻出，或损失比想象大。'},
'宝剑四':{kw:'休息 · 静养 · 暂停 · 恢复期',up:'骑士躺在石棺上休息，剑挂在墙上——这不是结束，是中场休息。身心都需要恢复。此刻的停下来，是为了走更远。给自己批个假。',down:'被迫停下（生病、强制休息），或休息太久不想动了。也可能是终于要重新出发。',lu:'关系进入冷静期，各自安静一下。',ld:'长期冷淡，或重新联系。',wu:'项目暂停、请假休整。别硬撑。',wd:'被迫停工，或复工在即。',mu:'财务活动暂停，观望期。',md:'被动停止投入，或该重启计划了。'},
'宝剑五':{kw:'惨胜 · 冲突 · 自私的赢 · 代价',up:'赢了，但对手都走了——这是「赢了道理输了感情」的牌。想清楚这场仗值不值得打，有些胜利的代价太高。',down:'冲突结束、和解，或彻底撕破脸。也可能是终于愿意退一步。',lu:'争吵中一定要赢，把人推得更远。',ld:'和好或彻底决裂。',wu:'职场斗争、抢功劳。赢了也别得意。',wd:'冲突缓和，或被彻底孤立。',mu:'为小利争执，失了大局。',md:'因计较而破财，或诉讼纠纷。'},
'宝剑六':{kw:'过渡 · 离开 · 平静的迁移 · 疗伤之旅',up:'小船载着人驶向对岸，水面渐渐平静。最难的部分过去了，正在往更好的地方去。适合搬迁、旅行、换环境。带着伤，但在前进。',down:'走不掉、反复回头，或旅程受阻。也可能是终于愿意离开了。',lu:'关系进入平静期，或带着遗憾各自走开。',ld:'想分又分不干净，或复合。',wu:'转职、调岗、换环境，一切在好转。',wd:'想走走不了，被困在原地。',mu:'财务状况缓慢改善。',md:'资金周转困难，进展缓慢。'},
'宝剑七':{kw:'策略 · 隐瞒 · 独自行动 · 投机',up:'偷偷抱走五把剑的人——这是「不走寻常路」的牌。可以理解为聪明的策略和保留实力，也可能是有人在暗中动手脚。多留个心眼。',down:'阴谋败露、真相曝光，或自首坦白。也可能是终于决定光明正大来。',lu:'有所隐瞒、不够坦诚，或第三者暗中活动。',ld:'谎言被戳穿，或选择坦白。',wu:'战术性保留信息，也要防同事使绊子。',wd:'被揭发，或识破了别人的把戏。',mu:'投机取巧的收益，风险不小。',md:'被骗、被偷、财务欺诈。看紧钱包。'},
'宝剑八':{kw:'自我设限 · 受困感 · 画地为牢 · 其实能走',up:'被绑着蒙眼站在剑阵中——但脚下是松的，绳子也没系死。困住你的是恐惧和自我否定，不是现实。睁开眼，你比想的自由。',down:'正在挣脱束缚，或彻底放弃抵抗。钥匙一直在你自己手里。',lu:'在关系中感到窒息，却不敢离开。',ld:'终于走出来，或更深地陷进去。',wu:'工作环境压抑，觉得没得选。其实有。',wd:'突破困局，或彻底认命。',mu:'被财务状况绑住手脚。',md:'摆脱经济束缚，或负担加重。'},

const TAROT_NAMES=Object.keys(TAROT_DB);
/* 按《塔罗解牌字典》体例，把一张牌的完整释义组装成文本 */
function tarotFullText(name,pos){
  const d=TAROT_DB[name];if(!d)return '';
  const rev=pos==='逆位';
  return `【${name} · ${rev?'逆位':'正位'}】
🏷 关键词：${d.kw}

🔮 牌意：${rev?d.down:d.up}

💕 感情：${rev?d.ld:d.lu}
💼 事业：${rev?d.wd:d.wu}
💰 财运：${rev?d.md:d.mu}`;
}
function tarotData(){if(!db.tarot)db.tarot={};if(!db.tarot[state.date])db.tarot[state.date]={cards:[]};return db.tarot[state.date];}

function renderTarot(){
  const t=tarotData();
  const cardRows=t.cards.map(c=>`
    <div class="rec-card">
      <div class="rec-head">
        <span style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex:1;">

          <select class="todo-time" style="background:#FDEFF5;color:var(--red);" onchange="tarotCardEdit('${c.id}','pos',this.value)">
            <option ${c.pos==='正位'?'selected':''}>正位</option><option ${c.pos==='逆位'?'selected':''}>逆位</option>
          </select>
        </span>
        <button class="del-btn" onclick="tarotCardDel('${c.id}')">✕</button>
      </div>
      <div class="f-row"><span class="f-label">🔮 单牌牌意（含关键词/感情/事业/财运 · 可编辑）</span>
      <textarea class="f-area" style="min-height:190px;line-height:1.7;" onchange="tarotCardEdit('${c.id}','meaning',this.value)">${esc(c.meaning||'')}</textarea>
      ${TAROT_DB[c.name]?`<button class="mini-btn" style="margin-top:6px" onclick="tarotResetMeaning('${c.id}')">🔄 恢复字典原文</button>`:''}</div>
    </div>`).join('')||`<div class="rec-card">
      <div class="rec-head">
        <input class="f-input tarot-name-input" list="tarotDatalist" value="" placeholder="输入牌名开始，如：愚人 / 圣杯骑士" style="flex:1;padding:12px 14px;font-size:15px;background:#F3EBFF;color:#8B6FC9;border-radius:12px;" onblur="if(this.value.trim())tarotNewCard(this.value)" onkeydown="if(event.key==='Enter'&&this.value.trim()){event.preventDefault();tarotNewCard(this.value);this.value='';}">
      </div>
      <div class="hint">💡 输入任意78张塔罗牌名即可（支持大/小阿尔卡纳），牌意自动写入 🔮</div>
    </div>`;
  return `
  <datalist id="tarotDatalist">${TAROT_NAMES.map(n=>`<option value="${n}">`).join('')}</datalist>
  <div class="card"><div class="card-title">🖼 牌阵拍照记录 <span class="tag">${state.date}</span></div>

function tarotCardAdd(){tarotData().cards.push({id:uid(),name:'',pos:'正位',meaning:''});save();renderAll();}
function tarotNewCard(name){
  const n=(name||'').trim();
  if(!n)return;
  /* 模糊匹配：用户可能输入简写 */
  let match=n;
  if(!TAROT_DB[n]){
    const found=TAROT_NAMES.find(k=>k.includes(n)||n.includes(k));
    if(found)match=found;
  }
  const c={id:uid(),name:match,pos:'正位',meaning:''};
  if(TAROT_DB[match])c.meaning=tarotFullText(match,'正位');
  tarotData().cards.push(c);save();renderAll();
}
function tarotCardEdit(id,k,v){
  const c=tarotData().cards.find(x=>x.id===id);if(!c)return;
  c[k]=v;
  if(k==='name'&&c.name&&!TAROT_DB[c.name]){
    /* 模糊匹配：输「愚」→「愚人」 */
    const f=TAROT_NAMES.find(x=>x.includes(c.name)||c.name.includes(x));
    if(f)c.name=f;
  }
  if((k==='name'||k==='pos')&&c.name&&TAROT_DB[c.name]){
    c.meaning=tarotFullText(c.name,c.pos||'正位');
    save();renderAll();return;
  }
  save();/* 手改牌意时不重渲染，避免失焦跳动 */
}
function tarotResetMeaning(id){
  const c=tarotData().cards.find(x=>x.id===id);if(!c||!TAROT_DB[c.name])return;
  c.meaning=tarotFullText(c.name,c.pos||'正位');save();renderAll();
}
function tarotCardDel(id){const t=tarotData();t.cards=t.cards.filter(x=>x.id!==id);save();renderAll();}
function tarotAutoCombo(){
  try{
    const t=tarotData();const cs=(t.cards||[]).filter(c=>c.name&&c.name.trim());
    if(cs.length<2){alert('⚠️ 至少需要 2 张已选的牌才能生成组合牌意哦～\n当前已有 '+cs.length+' 张');return;}
    const SUIT=[['权杖','🔥 火 · 行动与热情'],['圣杯','💧 水 · 情感与关系'],['宝剑','🗡 风 · 思维与沟通'],['星币','🪙 土 · 物质与务实']];
    const lines=cs.map((c,i)=>{
      const d=TAROT_DB[c.name];const rev=c.pos==='逆位';
      if(!d)return `第${i+1}张：${c.name}${rev?'（逆位）':'（正位）'}\n→ (自定义牌，无字典数据)`;
      return `第${i+1}张：${c.name}${rev?'（逆位）':'（正位）'}\n🏷 ${d.kw}\n→ ${rev?d.down:d.up}\n   💕${rev?d.ld:d.lu}\n   💼${rev?d.wd:d.wu}\n   💰${rev?d.md:d.mu}`;
    });
    /* 元素分布分析 */
    const cnt={};cs.forEach(c=>{const s=SUIT.find(s=>c.name.startsWith(s[0]));cnt[s?s[0]:'大牌']=(cnt[s?s[0]:'大牌']||0)+1;});
    const majorN=cnt['大牌']||0;
    let el='';
    if(majorN>=2&&majorN>=cs.length/2)el=`\n⚡ 大阿尔卡纳占了 ${majorN}/${cs.length} 张——这件事是命运级别的课题，不是小打小闹，值得认真对待。`;
    const domi=SUIT.find(s=>(cnt[s[0]]||0)>=2&&(cnt[s[0]]||0)>=cs.length/2);
    if(domi)el+=`\n⚡ ${domi[0]}牌集中出现——${domi[1]}，这是当前的主旋律。`;
    const revN=cs.filter(c=>c.pos==='逆位').length;
    const revTip=revN===0?'全为正位，能量顺畅，可以大胆推进。'
      :revN===cs.length?'全为逆位，阻力明显，此刻宜内省、调整，先别硬推。'
      :`${revN} 张逆位 / ${cs.length-revN} 张正位，顺逆交错——有机会也有功课，边走边校准。`;
    t.combo=`🔮 「${cs.map(c=>c.name+(c.pos==='逆位'?'(逆)':'')).join(' + ')}」组合解读\n${'─'.repeat(30)}\n\n${lines.join('\n\n')}\n\n${'─'.repeat(30)}\n\n🌙 整体解读：\n这组牌像是一段从「${cs[0].name}」走向「${cs[cs.length-1].name}」的旅程。\n前者是你当下的处境与心境，后者指向事情发展的方向。\n\n⚖️ 能量走向：${revTip}${el}\n\n🎯 结合你的问题「${t.question||'未设置'}」细细体会，答案就在牌面之间✨`;
    save();renderAll();
    /* 确保 textarea 更新显示 */
    setTimeout(()=>{const el=document.getElementById('comboText');if(el)el.value=t.combo;},100);
  }catch(e){alert('生成出错：'+e.message);}
}
function tarotAutoGuide(){
  try{
    const t=tarotData();const cs=(t.cards||[]).filter(c=>c.name&&c.name.trim());
    if(!cs.length){alert('⚠️ 先抽一张牌吧～目前还没有选牌');return;}
    const last=cs[cs.length-1];
    const d=TAROT_DB[last.name];const rev=last.pos==='逆位';
    const meaning=d?(rev?d.down:d.up):'请跟随直觉感受这张牌的能量';
    const advice=rev
      ?'今天适合放慢脚步 🐢 先处理内在情绪，再面对外部课题；对自己温柔一点，不急于做重大决定。'
      :'能量顺畅的一天 ☀️ 适合主动出击、推进重要计划；相信直觉，宇宙站在你这边。';
    const detail=d?`\n\n🏷 核心关键词：${d.kw}\n\n💕 感情面：${rev?d.ld:d.lu}\n💼 事业面：${rev?d.wd:d.wu}\n💰 财运面：${rev?d.md:d.mu}`:'';
    t.guide=`🌟 今日指导 · 以「${last.name}${rev?' 逆位':' 正位'}」为主轴\n${'─'.repeat(30)}\n\n${meaning}${detail}\n\n${'─'.repeat(30)}\n\n💫 行动建议：${advice}\n\n🎀 幸运提示：保持觉察，把牌面提示和「${t.question||'今日问题'}」对照，晚上回顾一下应验了哪些吧～`;
    save();renderAll();
    setTimeout(()=>{const el=document.getElementById('guideText');if(el)el.value=t.guide;},100);
  }catch(e){alert('生成出错：'+e.message);}
}

function renderRecipeMatch(){
  const rd=recipeData();
  return `
  <div class="card">

    <input class="f-input" id="recipeIngInput" value="${esc(rd.lastIngs||'')}" placeholder="输入你有的食材，如：土豆、牛肉、鸡蛋" style="margin-bottom:10px;">

function renderMatchCards(items){
  if(!items||!items.length)return '<div class="empty-tip">没有匹配到菜品呢，换个食材试试 💕</div>';
  return `<div style="margin-top:8px;">
    <div style="font-size:14px;font-weight:700;color:var(--red);margin-bottom:8px;">✅ 食材齐全可直接做（${items.length}道）</div>
    ${items.map((it,i)=>`
    <div class="rec-card" style="border-left:4px solid ${i%2===0?'var(--pink-deep)':'var(--blue-deep)'}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
        <span style="font-size:16px;font-weight:700;color:var(--red);">${esc(it.name)}</span>
        <div style="display:flex;gap:6px;">
          <span class="pill" style="background:#FFF0E5;color:#E89230;font-size:10px;">${it.diff||'简单'}</span>
          <span style="color:#7BC496;font-weight:700;font-size:13px;">约${it.cal}kcal</span>
        </div>
      </div>
      <div style="font-size:11px;color:var(--sub);margin-bottom:4px;">主料：${esc(it.ingredients||'')}</div>
      <div style="font-size:12px;color:var(--text);line-height:1.6;background:rgba(189,224,254,.12);padding:8px;border-radius:10px;">${esc(it.steps)}</div>
    </div>`).join('')}
  </div>`;
}
function matchRecipes(){
  const inp=document.getElementById('recipeIngInput');
  const raw=(inp&&inp.value)||'';
  if(!raw.trim()){alert('先输入食材哦～');return;}
  const ings=raw.split(/[,，、\s]+/).map(s=>s.trim()).filter(Boolean);
  const rd=recipeData();rd.lastIngs=raw;
  /* 查找匹配的菜品（去重） */
  const foundMap=new Map();
  for(const ing of ings){
    const list=RECIPE_DB[ing]||[];
    for(const dish of list){
      if(!foundMap.has(dish.name))foundMap.set(dish.name,dish);
    }
  }
  const results=[...foundMap.values()].slice(0,4);
  rd.lastMatch=results;save();
  document.getElementById('recipeMatchResult').innerHTML=renderMatchCards(results);
}

function addTopicManual(){
  const inp=document.getElementById('topicInput');
  const title=(inp&&inp.value||'').trim();
  if(!title)return;
  const md=mediaData();
  if(!md.topics)md.topics=[];
  md.topics.unshift({id:uid(),title,platform:'',category:'',date:state.date,manual:true});
  save();if(inp)inp.value='';renderAll();
}

function addCopy(){
  const inp=document.getElementById('copyInput');
  const text=(inp&&inp.value||'').trim();
  if(!text)return;
  const md=mediaData();
  if(!md.copies)md.copies=[];
  md.copies.unshift({id:uid(),text});
  save();if(inp)inp.value='';renderAll();
}
function copyEdit(id,v){const md=mediaData();const c=(md.copies||[]).find(x=>x.id===id);if(c){c.text=v;save();}}
function copyDel(id){const md=mediaData();md.copies=(md.copies||[]).filter(x=>x.id!==id);save();renderAll();}
function addBgm(){
  const t=document.getElementById('bgmTitleInput');
  const u=document.getElementById('bgmUrlInput');
  const title=(t&&t.value||'').trim();
  const url=(u&&u.value||'').trim();
  if(!url){alert('请输入抖音视频链接哦～');return;}
  const md=mediaData();
  if(!md.bgms)md.bgms=[];
  md.bgms.unshift({id:uid(),title:title||'BGM',url});
  save();if(t)t.value='';if(u)u.value='';renderAll();
}
function bgmEditTitle(id,v){const md=mediaData();const it=(md.bgms||[]).find(x=>x.id===id);if(it){it.title=v;save();}}
function bgmEditUrl(id,v){const md=mediaData();const it=(md.bgms||[]).find(x=>x.id===id);if(it){it.url=v;save();}}
function bgmDel(id){const md=mediaData();md.bgms=(md.bgms||[]).filter(x=>x.id!==id);save();renderAll();}
function playBgm(id){
  const md=mediaData();
  const it=(md.bgms||[]).find(x=>x.id===id);
  if(it&&it.url){window.open(it.url,'_blank');}
}

      </label>
      <input class="packing-name-input ${it.checked?'packed':''}" value="${esc(it.name)}" onchange="packEditName('${it.id}',this.value)">
      <button class="packing-del" onclick="delPackItem('${it.id}')">×</button>
    </div>`).join('');
  return `
  <div class="card">
    <div class="card-title">🧳 出行行李清单</div>
    <div style="font-size:11px;color:var(--sub);margin-bottom:12px;">已打包 ${checkedCount}/${items.length} 件 · 长按整行可拖动排序</div>
    <div class="packing-list">${rows}</div>
    <div class="packing-add-row" style="flex-direction:column;align-items:stretch;gap:8px;">
      <input class="f-input" id="packNewInput" placeholder="新增物品" style="padding:14px 16px;font-size:16px;" onkeydown="if(event.key==='Enter')addPackItem()">
      <button class="add-btn-grad" onclick="addPackItem()" style="align-self:flex-end;padding:6px 18px;font-size:13px;">添加</button>
    </div>
    <button class="mini-btn" style="width:100%;margin-top:10px;background:linear-gradient(135deg,rgba(189,224,254,.2),rgba(249,201,221,.2));" onclick="resetPacking()">🔄 重置勾选（下次出行）</button>
  </div>`;
}
function togglePackItem(id){
  const items=initPacking();
  const it=items.find(x=>x.id===id);
  if(it){it.checked=!it.checked;save();renderAll();}
}
function packEditName(id,v){
  const items=initPacking();
  const it=items.find(x=>x.id===id);
  if(it){it.name=v;save();}   /* 不重渲染，避免输入时失焦跳动 */
}
function reorderPacking(ids){
  const items=initPacking();
  const map={};items.forEach(it=>map[it.id]=it);
  const ordered=ids.map(id=>map[id]).filter(Boolean);
  if(ordered.length)travelData().packing=ordered;
  save();renderAll();
}
/* 长按拖拽排序（移动端 touch） */
function setupPackingDrag(){
  const root=document.getElementById('content');
  if(!root||root._pkDragInited)return;
  root._pkDragInited=true;
  let pressTimer=null,dragging=false,el=null;
  const isCtrl=t=>t&&(t.closest('input')||t.closest('button')||t.closest('label'));
  root.addEventListener('touchstart',e=>{
    const item=e.target.closest('.packing-item');
    if(!item||isCtrl(e.target))return;
    el=item;
    pressTimer=setTimeout(()=>{dragging=true;el.classList.add('dragging');if(navigator.vibrate)navigator.vibrate(40);},350);
  },{passive:true});
  root.addEventListener('touchmove',e=>{
    if(!dragging||!el)return;
    e.preventDefault();
    const y=e.touches[0].clientY,list=el.parentNode;
    let ref=null;
    list.querySelectorAll('.packing-item:not(.dragging)').forEach(o=>{
      const r=o.getBoundingClientRect();
      if(y<r.top+r.height/2&&!ref)ref=o;
    });
    if(ref)list.insertBefore(el,ref);else list.appendChild(el);
  },{passive:false});
  const end=()=>{
    if(pressTimer)clearTimeout(pressTimer);
    if(!dragging){el=null;return;}
    dragging=false;
    if(el)el.classList.remove('dragging');
    const ids=[...root.querySelectorAll('.packing-item')].map(x=>x.getAttribute('data-id'));
    el=null;reorderPacking(ids);
  };
  root.addEventListener('touchend',end);
  root.addEventListener('touchcancel',end);
}
function addPackItem(){
  const inp=document.getElementById('packNewInput');
  const name=(inp&&inp.value||'').trim();
  if(!name)return;
  const items=initPacking();
  items.push({id:uid(),name,checked:false,order:items.length});
  save();if(inp)inp.value='';renderAll();
}
function delPackItem(id){
  let items=initPacking();
  items=items.filter(x=>x.id!==id);
  travelData().packing=items;save();renderAll();
}
function resetPacking(){
  const items=initPacking();
  items.forEach(it=>{it.checked=false;});
  save();renderAll();
}
function renderTravelItinerary(){
  const td=travelData();
  const itins=td.itinerary||[];
  const rows=itins.map((it,i)=>`
    <div class="rec-card">
      <div class="rec-head"><span class="rec-date">Day ${i+1} · ${esc(it.date||'')}</span><button class="del-btn" onclick="delItin('${it.id}')">✕</button></div>
      <div style="font-weight:700;color:var(--red);margin-bottom:4px;">${esc(it.title)}</div>
      <div style="font-size:12px;color:var(--text);line-height:1.6;white-space:pre-wrap;">${esc(it.content)}</div>
    </div>`).join('')||'<div class="empty-tip">还没有行程规划哦，开始规划你的旅行吧 ✈️</div>';
  return `
  <div class="card">
    <div class="card-title">📋 行程攻略</div>
    ${rows}
    <button class="add-btn-grad" style="width:100%;margin-top:8px;" onclick="addItin()">✨ 新增一天行程</button>
  </div>`;
}
function addItin(){
  const td=travelData();
  td.itinerary.push({id:uid(),date:'',title:'',content:''});
  save();renderAll();
}
function delItin(id){
  const td=travelData();
  td.itinerary=(td.itinerary||[]).filter(x=>x.id!==id);save();renderAll();
}
/* 行程编辑通过直接绑定 */
document.addEventListener('DOMContentLoaded',()=>{
  setTimeout(()=>{
    const app=document.getElementById('app');
    if(app)app.addEventListener('change',(e)=>{
      if(e.target&&e.target.dataset&&e.target.dataset.itinField){
        const field=e.target.dataset.itinField;
        const id=e.target.dataset.itinId;
        const td=travelData();
        const it=(td.itinerary||[]).find(x=>x.id===id);
        if(it){it[field]=e.target.value;save();}
      }
      if(e.target&&e.target.dataset&&e.target.dataset.packName){
        const id=e.target.dataset.packId;
        const items=initPacking();
        const it=items.find(x=>x.id===id);
        if(it){it.name=e.target.value;save();}
      }
    },true);
  },500);
});
